<div id="panel">

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const hex=h=>new THREE.Color(h);
function rng(s){ return ()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick=(R,a)=>a[Math.floor(R()*a.length)];
const shade=(c,R,a=0.05)=>c.clone().multiplyScalar(1+(R()-0.5)*2*a);

/* ================= flowers =================
   Hanging baskets and small flowers at ground level, each built as one piece of flat-shaded, vertex-coloured
   geometry in its own frame, as the game builds everything else: the faces are triangles with a normal each, so
   that petals and leaves catch the light in facets. Every petal and leaf is a thin flat shape seen from both sides.

   Hanging baskets (basket(kind, R)): the frame's origin is the bracket's fixing on the wall, the wall is the plane
   z = 0 and the basket hangs out along +z. An iron bracket with a stay holds a hook 0.42 m out from the wall; three
   chains run down from it to the rim of a wire basket lined with coir, 0.36 m across. The plants fill the basket
   and spill over its rim, each built leaf by leaf (see the leaves below). The kinds:
     geranium   zonal geraniums: round heads of scarlet or pink flowers on short stalks above rounded leaves
     petunia    trailing petunias: broad trumpets in purple, magenta and white, over the mound and down the trails
     lobelia    blue and white lobelia, a haze of tiny flowers trailing low, round a few red begonias in the middle
     ivy        ivy-leaved geraniums: long cascades of pink flowers, falling to about a metre below the basket
   Small flowers at ground level, each standing on the ground at its origin:
     pot(kind)        a terracotta pot with a geranium (red, pink or white), basil or a small lavender
     valerian()       a clump of red valerian, the flower of old walls: upright stems with domed heads of tiny flowers
     wild(r)          a patch of wild flowers, r metres across: poppies, white and yellow daisies, blue borage and
                      tufts of grass
     lavender()       a clump of lavender: a grey-green cushion of leaves under many purple spikes
   Each returns {geo, tris}; geo has position, normal and color attributes. */
const IRON=hex('#2e2a28'), COIR=hex('#6b4f33'), STEM=hex('#4f6b2c'), LEAF=[hex('#4e6a2c'),hex('#5b7834'),hex('#465f27'),hex('#62803a')];
const TERRA=hex('#c8714a'), SOIL=hex('#4a3524');
function builder(){
  const P=[], N=[], Cc=[], _a=new THREE.Vector3(), _b=new THREE.Vector3(), _n=new THREE.Vector3();
  const V=(x,y,z)=>new THREE.Vector3(x,y,z);
  const tri=(a,b,c,col)=>{ _a.subVectors(b,a); _b.subVectors(c,a); _n.crossVectors(_a,_b); if (_n.lengthSq()<1e-14) return; _n.normalize();
    P.push(a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z); for (let k=0;k<3;k++){ N.push(_n.x,_n.y,_n.z); Cc.push(col.r,col.g,col.b); } };
  const quad=(a,b,c,d,col)=>{ tri(a,b,c,col); tri(a,c,d,col); };
  // a rod of square section from p to q, t thick
  const rod=(p,q,t,col)=>{ const d=V().subVectors(q,p), L=d.length(); if (L<1e-5) return; d.divideScalar(L);
    const u=Math.abs(d.y)<0.9?V(0,1,0):V(1,0,0), s=V().crossVectors(d,u).normalize().multiplyScalar(t/2), w=V().crossVectors(d,s).normalize().multiplyScalar(t/2);
    const c=[V().add(s).add(w),V().add(s).sub(w),V().sub(s).sub(w),V().sub(s).add(w)];
    for (let i=0;i<4;i++){ const a=c[i], b=c[(i+1)%4]; quad(V().addVectors(p,a),V().addVectors(p,b),V().addVectors(q,b),V().addVectors(q,a),col); } };
  // a lumpy faceted mass of leaves, darker beneath and lighter on top
  const lump=(x,y,z,rx,ry,rz,col,R,detail=1)=>{ const g=new THREE.IcosahedronGeometry(1,detail), p=g.attributes.position, m=new Map(), pts=[];
    for (let i=0;i<p.count;i++){ const k=p.getX(i).toFixed(3)+','+p.getY(i).toFixed(3)+','+p.getZ(i).toFixed(3); if (!m.has(k)) m.set(k,0.82+R()*0.3); const j=m.get(k); pts.push(V(x+p.getX(i)*rx*j,y+p.getY(i)*ry*j,z+p.getZ(i)*rz*j)); }
    for (let i=0;i<pts.length;i+=3){ const cy=(pts[i].y+pts[i+1].y+pts[i+2].y)/3, t=clamp((cy-(y-ry))/(2*ry),0,1);
      tri(pts[i],pts[i+1],pts[i+2],col.clone().multiplyScalar(0.72+0.42*t+(R()-0.5)*0.08)); }
    g.dispose(); };
  // an orthonormal pair across the direction n
  const across=n=>{ const u=Math.abs(n.y)<0.9?V(0,1,0):V(1,0,0), a=V().crossVectors(n,u).normalize(), b=V().crossVectors(n,a).normalize(); return [a,b]; };
  // a flower of k petals facing n: each petal a diamond, cupped up by cup, round a centre of another colour
  const flower=(c,n,size,k,col,eye,R,cup=0.15,thin=0.42)=>{ n=n.clone().normalize(); const [a,b]=across(n), a0=R()*6.283;
    for (let i=0;i<k;i++){ const t=a0+i*6.283/k, d=V().addScaledVector(a,Math.cos(t)).addScaledVector(b,Math.sin(t)), s=V().crossVectors(n,d);
      const tip=V().copy(c).addScaledVector(d,size).addScaledVector(n,size*cup), mid=V().copy(c).addScaledVector(d,size*0.5).addScaledVector(n,size*cup*0.3);
      const pc=shade(col,R,0.06); quad(c,V().copy(mid).addScaledVector(s,size*thin*0.5),tip,V().copy(mid).addScaledVector(s,-size*thin*0.5),pc); }
    if (eye){ const e=size*0.28, p=V().copy(c).addScaledVector(n,size*0.05);
      for (let i=0;i<5;i++){ const t0=i*1.2566, t1=t0+1.2566; tri(p,V().copy(p).addScaledVector(a,Math.cos(t0)*e).addScaledVector(b,Math.sin(t0)*e),V().copy(p).addScaledVector(a,Math.cos(t1)*e).addScaledVector(b,Math.sin(t1)*e),eye); } } };
  // a leaf: a diamond from p along d, lying across the normal n
  const leaf=(p,d,n,size,col)=>{ d=d.clone().normalize(); const s=V().crossVectors(d,n).normalize().multiplyScalar(size*0.3), m=V().copy(p).addScaledVector(d,size*0.45).addScaledVector(n,size*0.08);
    quad(p,V().copy(m).add(s),V().copy(p).addScaledVector(d,size),V().copy(m).sub(s),col); };
  // a ring of n sides from radius r0 at y0 to r1 at y1 (open), facing outwards
  const ring=(cx,cz,r0,y0,r1,y1,n,col,R,inward=false)=>{ for (let i=0;i<n;i++){ const t0=i/n*6.283, t1=(i+1)/n*6.283;
      const a=V(cx+Math.cos(t0)*r0,y0,cz+Math.sin(t0)*r0), b=V(cx+Math.cos(t1)*r0,y0,cz+Math.sin(t1)*r0), c=V(cx+Math.cos(t1)*r1,y1,cz+Math.sin(t1)*r1), d=V(cx+Math.cos(t0)*r1,y1,cz+Math.sin(t0)*r1);
      const k=R?shade(col,R,0.04):col; if (inward) quad(a,d,c,b,k); else quad(a,b,c,d,k); } };
  const disc=(cx,y,cz,r,n,col)=>{ const o=V(cx,y,cz); for (let i=0;i<n;i++){ const t0=i/n*6.283, t1=(i+1)/n*6.283; tri(o,V(cx+Math.cos(t1)*r,y,cz+Math.sin(t1)*r),V(cx+Math.cos(t0)*r,y,cz+Math.sin(t0)*r),col); } };
  const done=()=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(Cc,3)); return {geo:g,tris:P.length/9}; };
  return {V,tri,quad,rod,lump,flower,leaf,ring,disc,across,done};
}
// a round head of small flowers (a geranium's or a valerian's), facing up
function head(B,c,r,n,col,R,size){ for (let i=0;i<n;i++){ const u=R()*2-1, t=R()*6.283, s=Math.sqrt(1-u*u)*0.9, d=B.V(Math.cos(t)*s,Math.abs(u)*0.8+0.35,Math.sin(t)*s).normalize();
  B.flower(B.V().copy(c).addScaledVector(d,r),d,size*(0.8+R()*0.4),5,col,null,R,0.1,0.55); } }

/* ---- leaves ----
   Every leaf is drawn on its own, after the real plant's leaf:
     zonal geranium   rounded and kidney-shaped, about 9 cm across, with shallow scalloped lobes, a deep notch where
                      the stalk joins and a narrow dark band round it, open on the side of the stalk (the "horseshoe")
     ivy geranium     shield-shaped, with five shallow pointed lobes, the stalk joining near the middle, glossy
     begonia          rounded, glossy, waxy, green or bronze
     petunia          oval, soft, mid green, set alternately along the stems
     lobelia          tiny, narrow to spoon-shaped, on fine spreading stems
     basil            oval and cupped, bright green, in opposite pairs, each pair at right angles to the last
     valerian         lance-shaped, blue-grey, in opposite pairs on the stems and in a tuft at the base
     lavender         narrow, grey-green, in whorls on short shoots that make the cushion under the spikes
     poppy            downy and deeply cut into lance-shaped lobes, in a rosette on the ground
     daisy            spoon-shaped, in a small rosette on the ground
     crown daisy      finely cut and feathery, up the stalk
     borage           broad and oval, bristly, dull green, at the base
   A blade leaf (blade) is a strip from its stalk to its tip, as wide as its outline w(u) at each point along it,
   folded along its midrib and bending down towards the tip; a round leaf (round) is a fan from its middle, as far
   out as its outline r(θ) in each direction, cupped. */
const LF={
  zonal:hex('#4d7a32'), zone:hex('#3a3a1e'), ivy:hex('#3f7a2c'), begonia:hex('#4f8a2e'), bronze:hex('#6b3a2c'),
  petunia:hex('#5a7c34'), lobelia:hex('#3f6a2a'), basil:hex('#5aa032'), valerian:hex('#7a9682'), lavender:hex('#8a9c84'),
  poppy:hex('#6f8f3c'), daisy:hex('#5f8a36'), crown:hex('#6a9440'), borage:hex('#5d7d3a') };
function frame(V,d,up){ d=d.clone().normalize(); const s=V().crossVectors(d,up).normalize(), n=V().crossVectors(s,d).normalize(); return [d,s,n]; }
function blade(B,base,dir,up,len,w,col,R,o={}){ const {V}=B, [d,s,n]=frame(V,dir,up), m=o.seg||4, fold=o.fold??0.35, droop=o.droop??0.25;
  const c=shade(col,R,0.07), c2=c.clone().multiplyScalar(0.9);
  const P=u=>{ const p=V().copy(base).addScaledVector(d,len*u).addScaledVector(n,-droop*len*u*u), h=w(u)*len; return [p,V().copy(p).addScaledVector(s,h).addScaledVector(n,fold*h),V().copy(p).addScaledVector(s,-h).addScaledVector(n,fold*h)]; };
  let a=P(0); for (let k=1;k<=m;k++){ const b=P(k/m); B.quad(a[0],a[1],b[1],b[0],c); B.quad(a[0],b[0],b[2],a[2],c2); a=b; } }
function round(B,mid,dir,up,size,r,col,R,o={}){ const {V}=B, [d,s,n]=frame(V,dir,up), m=o.seg||14, cup=o.cup??0.25, rings=o.zone?[0,0.48,0.66,1]:[0,0.55,1];
  const c=shade(col,R,0.06), zc=o.zone?o.zone.clone().lerp(c,0.35):null;
  const P=(t,q)=>V().copy(mid).addScaledVector(d,Math.cos(t)*r(t)*size*q).addScaledVector(s,Math.sin(t)*r(t)*size*q).addScaledVector(n,cup*size*q*q);
  for (let i=0;i<m;i++){ const t0=i/m*6.283, t1=(i+1)/m*6.283, back=Math.abs(Math.PI-(t0+t1)/2)<0.75;
    for (let j=0;j<rings.length-1;j++){ const q0=rings[j], q1=rings[j+1], k=(o.zone && j===1 && !back)?zc:c.clone().multiplyScalar(1-0.05*j);
      if (j===0) B.tri(P(t0,0),P(t0,q1),P(t1,q1),k); else B.quad(P(t0,q0),P(t0,q1),P(t1,q1),P(t1,q0),k); } } }
const W={
  ovate:u=>0.32*Math.sin(Math.PI*Math.pow(u,0.75)), lance:u=>0.15*Math.sin(Math.PI*Math.pow(u,0.85)), linear:u=>0.07*Math.sin(Math.PI*Math.pow(u,0.4)),
  spoon:u=>0.26*Math.sin(Math.PI*Math.pow(u,1.9)), narrowSpoon:u=>0.2*Math.sin(Math.PI*Math.pow(u,1.5)),
  cut:u=>0.24*Math.sin(Math.PI*u)*(0.35+0.65*Math.abs(Math.sin(4.5*Math.PI*u))), feather:u=>0.16*Math.sin(Math.PI*u)*(0.2+0.8*Math.abs(Math.sin(6*Math.PI*u))) };
const Rd={
  // crenate, with a deep notch at the stalk (θ = π)
  zonal:t=>(1-0.07*Math.abs(Math.sin(3.5*t)))*(0.3+0.7*smooth(Math.abs(t-Math.PI)/0.5)),
  ivy:t=>0.74+0.26*Math.pow(Math.abs(Math.cos(2.5*t)),2.2),
  begonia:t=>0.86+0.14*Math.cos(t) };
const leafOut=(V,ow,R,down=0.15)=>V().copy(ow).add(V((R()-0.5)*0.6,-down,(R()-0.5)*0.6)).normalize();
const UP=new THREE.Vector3(0,1,0);

// a zonal geranium rooted at base, its leaves spread to about rad: leaves on long stalks, the inner ones held higher,
// and round heads of flowers on stalks standing well clear of them
function zonal(B,base,rad,hgt,col,nLeaves,nHeads,R){ const {V}=B;
  for (let i=0;i<nLeaves;i++){ const t=i*2.39996+R()*0.3, f=Math.sqrt((i+0.5)/nLeaves), reach=rad*(0.1+0.7*f), ow=V(Math.cos(t),0,Math.sin(t));
    const tip=V().copy(base).addScaledVector(ow,reach).add(V(0,hgt*(1-f*0.7)*(0.8+R()*0.4)+0.01,0)), size=0.05*(0.85+R()*0.35);
    B.rod(V().copy(base).addScaledVector(ow,0.01),tip,0.006,STEM);
    // the inner leaves turn up towards the light and the outer ones out and a little down, so that together they
    // make a mound
    const tiltUp=lerp(0.9,-0.25,f)+(R()-0.5)*0.4, dir=V().copy(ow).add(V(0,tiltUp,0)).normalize(), side=V(-ow.z,0,ow.x), up=V().crossVectors(side,dir).normalize();
    round(B,V().copy(tip).addScaledVector(dir,size*0.32),dir,up,size,Rd.zonal,LF.zonal,R,{zone:LF.zone,cup:0.18}); }
  for (let i=0;i<nHeads;i++){ const t=R()*6.283, r=rad*(0.15+R()*0.35), q=V().copy(base).add(V(Math.cos(t)*r*1.6,hgt+0.08+R()*0.07,Math.sin(t)*r*1.6));
    B.rod(base,q,0.007,STEM); head(B,q,0.045,20,col,R,0.026); } }
// a run of stem from p0 along at(u), with a node every gap: leafAt(p, ow, u, k) and flowerAt(p, ow, u, k) at each
function trail(B,at,L,gap,ow,leafAt,flowerAt,th=0.006){ const n=Math.max(2,Math.round(L/gap)); let p0=at(0);
  for (let k=1;k<=n;k++){ const u=k/n, p1=at(u); B.rod(p0,p1,th,STEM); leafAt(p1,ow,u,k); if (flowerAt) flowerAt(p1,ow,u,k); p0=p1; } }

const BASKETS={
  geranium:{cols:[['#d8302e','#c92a2a','#e0413a'],['#e05a84','#d44c78']]},
  petunia:{cols:[['#7a3a9c','#a23f9e','#f3eef2','#c63a8c']]},
  lobelia:{cols:[['#3a5fc8','#2f4fb5','#f2f2f5','#5a7ad8']]},
  ivy:{cols:[['#e46aa4','#d9579a','#ef8bbb']]},
};
function basket(kind,R){
  const B=builder(), {V}=B, K=BASKETS[kind], cols=pick(R,K.cols).map(hex);
  // the bracket: a back plate on the wall, an arm out to a hook, and a stay under it
  B.rod(V(0,-0.16,0.01),V(0,0.14,0.01),0.05,IRON);
  B.rod(V(0,0,0.02),V(0,0,0.44),0.022,IRON);
  B.rod(V(0,-0.14,0.02),V(0,-0.005,0.26),0.016,IRON);
  for (let i=0;i<6;i++){ const a0=i/6*Math.PI*1.6, a1=(i+1)/6*Math.PI*1.6, r=0.035;   // a scroll at the arm's end
    B.rod(V(0,-r+Math.cos(a0)*r,0.44+Math.sin(a0)*r*0.9),V(0,-r+Math.cos(a1)*r,0.44+Math.sin(a1)*r*0.9),0.014,IRON); }
  const hx=0, hy=-0.02, hz=0.42, by=-0.62, rr=0.18, bz=hz;
  B.rod(V(hx,hy,hz),V(hx,hy-0.08,hz),0.012,IRON);
  // three chains, each a run of short links turned alternately
  for (let i=0;i<3;i++){ const t=i/3*6.283+0.5, q=V(hx+Math.cos(t)*rr*0.95,by,bz+Math.sin(t)*rr*0.95), p=V(hx,hy-0.08,hz), n=9;
    for (let k=0;k<n;k++){ const a=V().lerpVectors(p,q,k/n), b=V().lerpVectors(p,q,(k+0.85)/n); B.rod(a,b,k%2?0.008:0.013,IRON); } }
  // the basket: a wire rim and a bowl lined with coir, filled with compost
  B.ring(hx,bz,rr+0.01,by+0.012,rr+0.01,by-0.012,12,IRON,null);
  B.ring(hx,bz,rr,by,rr*0.82,by-0.08,12,COIR,R); B.ring(hx,bz,rr*0.82,by-0.08,rr*0.45,by-0.15,12,COIR,R); B.disc(hx,by-0.15,bz,rr*0.45,12,COIR.clone().multiplyScalar(0.8));
  B.disc(hx,by-0.01,bz,rr,12,SOIL);
  for (let i=0;i<6;i++){ const t=i/6*6.283; B.rod(V(hx+Math.cos(t)*rr,by,bz+Math.sin(t)*rr),V(hx+Math.cos(t)*rr*0.45,by-0.15,bz+Math.sin(t)*rr*0.45),0.008,IRON); }
  const base=V(hx,by,bz);
  // a stem from the middle out over the rim and down, t its direction round the basket, L its length below the rim
  const over=(t,L,out)=>u=>{ const k=Math.min(1,u*3), r=rr*0.3+(rr*0.7+out)*Math.sin(k*Math.PI/2); return V(hx+Math.cos(t)*r,by+0.06*Math.sin(k*Math.PI)-Math.max(0,u-0.3)/0.7*L,bz+Math.sin(t)*r); };
  if (kind==='geranium'){
    // two plants of zonal geranium, their leaves spilling a little over the rim
    for (const sd of [-1,1]) zonal(B,V(hx+sd*0.05,by,bz+sd*0.03),0.26,0.13,pick(R,cols),30,5,R);

// the plants
const plants=new THREE.Group(); scene.add(plants); const counts={};
function place(r,x,y,z,ry=0,label){ const m=new THREE.Mesh(r.geo,matF); m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=m.receiveShadow=true; plants.add(m); if (label) counts[label]=(counts[label]||0)+r.tris; return m; }
const SPOTS={basket1:[-5.2,2.75],basket2:[-1.6,2.75],basket3:[1.6,2.75],basket4:[5.2,2.75]};
function build(){
  for (const m of plants.children) m.geometry.dispose(); plants.clear(); for (const k in counts) delete counts[k];
  const R=rng(state.seed*7919+3);
  ['geranium','petunia','lobelia','ivy'].forEach((k,i)=>{ const [x,y]=SPOTS['basket'+(i+1)]; place(basket(k,R),x,y,0.06,0,'basket '+k); });
  // pots on the doorstep and along the wall
  [[-1.0,0.12,0.35,'geranium-red',1],[1.0,0.12,0.35,'geranium-pink',1],[-2.3,0,0.3,'basil',0.8],[2.3,0,0.3,'lavender',0.9],[-4.6,0,0.3,'geranium-white',1.1],[4.6,0,0.32,'geranium-red',1.2],[5.0,0,0.62,'geranium-pink',0.85]]
    .forEach(([x,y,z,k,s])=>place(pot(k,R,s),x,y,z,R()*6,'pot '+k));
  // valerian at the foot of the wall and in the corner of the step
  for (const [x,z] of [[-6.2,0.2],[-5.85,0.34],[6.3,0.22],[-2.95,0.3]]) place(valerian(R),x,0,z,R()*6,'valerian');
  // wild flowers and lavender across the street
  for (const [x,z,r] of [[-3,6.5,1.4],[2.5,7.5,1.8],[-6.5,9,1.2],[6.5,6.8,1.1]]) place(wild(r,R),x,Math.max(0,groundH(x,z)),z,0,'wild flowers');
  for (const [x,z] of [[0,6.2],[-1,6.6],[5,9.5]]) place(lavender(R),x,Math.max(0,groundH(x,z)),z,R()*6,'lavender');
}
const VIEWS={
  street:[[1.5,1.7,9],[0,1.6,0]], baskets:[[0,2.4,4.2],[0,2.2,0]],
  basket1:[[-4.75,2.35,1.75],[-5.2,2.1,0.45]], basket2:[[-1.15,2.35,1.75],[-1.6,2.1,0.45]], basket3:[[2.05,2.35,1.75],[1.6,2.1,0.45]], basket4:[[5.75,2.3,2.0],[5.2,1.9,0.45]],
  pots:[[0.3,1.3,2.6],[0,0.35,0.3]], valerian:[[-5.0,0.9,1.6],[-6.0,0.3,0.25]], wild:[[-1.6,0.9,4.6],[-3,0.1,6.5]], lavender:[[0.8,0.9,4.8],[-0.3,0.25,6.4]],
  walk:[[-7,1.62,2.2],[0,1.4,1.2]], far:[[4,4,20],[0,1.5,0]] };
function aim(){ const [p,t]=VIEWS[state.view]; camera.position.set(...p); controls.target.set(...t); controls.update(); }
document.getElementById('view').value=state.view; document.getElementById('h').value=state.hour;
document.getElementById('view').onchange=e=>{ state.view=e.target.value; aim(); };
document.getElementById('h').oninput=e=>{ state.hour=+e.target.value; daylight(); };
document.getElementById('seed').onclick=()=>{ state.seed++; build(); };
document.getElementById('turn').onclick=e=>{ state.turn=!state.turn; e.target.classList.toggle('on',state.turn); controls.autoRotate=state.turn; };
if (Q.get('panel')==='0') document.getElementById('panel').classList.add('hide');
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
build(); daylight(); aim();
let last=performance.now(), fr=0, ft=0;
renderer.setAnimationLoop(now=>{ const dt=Math.min(0.05,(now-last)/1000); last=now;
  controls.update(); sun.target.position.copy(controls.target); sun.position.copy(controls.target).addScaledVector(SUN_DIR,120); sky.position.copy(camera.position);
  renderer.render(scene,camera);
  fr++; ft+=dt; if (ft>0.5){ document.getElementById('stats').textContent=`${Math.round(fr/ft)} frames a second\n`+Object.entries(counts).map(([k,v])=>`${k}: ${(v/1000).toFixed(1)} k triangles`).join('\n'); fr=ft=0; } });
window.__flowers={state,aim,daylight,build,setCam(c,t){ camera.position.set(...c); controls.target.set(...t); controls.update(); },set(o){ Object.assign(state,o); if ('seed' in o) build(); daylight(); aim(); }};
</script>
</body>
</html>
