<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coast · art gallery</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fc0dc;font-family:'Alegreya Sans',system-ui,sans-serif;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #panel{position:fixed;top:12px;right:12px;width:260px;padding:12px 14px;border-radius:10px;
    background:rgba(250,246,238,0.88);color:#2b2b35;font-size:15px;box-shadow:0 2px 14px rgba(0,0,0,0.15);}
  #panel .row{display:grid;grid-template-columns:78px 1fr 58px;align-items:center;gap:6px;margin:5px 0;}
  #panel .row.sel{grid-template-columns:78px 1fr;}
  #panel label{color:#555}
  #panel output{text-align:right;font-variant-numeric:tabular-nums;}
  #panel input[type=range]{width:100%;accent-color:#2f5f8f;}
  #panel select{font:inherit;font-size:14px;padding:4px 6px;border:1px solid #c9bda9;border-radius:6px;background:#fffaf2;color:#2b2b35;}
  #panel .stats{margin-top:8px;font-size:13px;color:#555;white-space:pre-line;}
  @media (max-width:520px){ #panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="row sel"><label for="view">View</label><select id="view">
    <option value="front">Front, 15 m</option><option value="door">Doorway, 4 m</option><option value="doors">The doors</option><option value="sign">Sign</option>
    <option value="in">Inside, from the door</option><option value="back">Inside, from the back</option>
    <option value="wall">Inside, a side wall</option><option value="air">From above</option></select></div>
  <div class="row sel"><label for="src">Pictures</label><select id="src">
    <option value="mine">Mine</option><option value="photos">My photos only</option><option value="sample">Samples</option></select></div>
  <div class="row"><label for="h">Time</label><input id="h" type="range" min="6" max="20" step="0.05" value="11"><output id="hV">11:00</output></div>
  <div class="stats" id="stats"></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import { buildArtGallery, pickPictures, GALLERY } from '../photo/artgallery.js';

const canvas=document.getElementById('c'), stats=document.getElementById('stats');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene(); scene.background=new THREE.Color('#9fc0dc'); scene.fog=new THREE.Fog('#bcd2e2',60,260);
const camera=new THREE.PerspectiveCamera(60,1,0.05,600);
const controls=new OrbitControls(camera,canvas); controls.enableDamping=true;
const hemi=new THREE.HemisphereLight(0xcfe3f5,0xb59b78,0.9); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1dd,2.6); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:80}); sun.shadow.bias=-0.0004; scene.add(sun,sun.target);

// the square in front of it: paving, and the ends of two neighbouring houses for scale
{ const g=new THREE.Mesh(new THREE.PlaneGeometry(200,200).rotateX(-Math.PI/2),new THREE.MeshStandardMaterial({color:'#cdb994',roughness:0.95})); g.receiveShadow=true; scene.add(g);
  for (const [x,c] of [[-10.5,'#e3c9a1'],[10.5,'#d9b48a']]){ const h=new THREE.Mesh(new THREE.BoxGeometry(6,6.5,9),new THREE.MeshStandardMaterial({color:c,roughness:0.9})); h.position.set(x,3.25,-1); h.castShadow=h.receiveShadow=true; scene.add(h);
    const r=new THREE.Mesh(new THREE.ConeGeometry(5,1.6,4).rotateY(Math.PI/4),new THREE.MeshStandardMaterial({color:'#b5523b',roughness:0.8})); r.scale.set(1.25,1,1.85); r.position.set(x,7.3,-1); r.castShadow=true; scene.add(r); } }

// pictures: the gallery's own, from the browser's storage, as the game keeps them; or samples
async function loadMine(){
  try{
    const db=await new Promise((res,rej)=>{ const q=indexedDB.open('coast-pictures',1); q.onupgradeneeded=()=>q.result.createObjectStore('photos',{keyPath:'id'}); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
    const recs=await new Promise((res,rej)=>{ const t=db.transaction('photos','readonly').objectStore('photos').getAll(); t.onsuccess=()=>res(t.result||[]); t.onerror=()=>rej(t.error); });
    const bm=async b=>{ const i=await createImageBitmap(b), c=document.createElement('canvas'); c.width=i.width; c.height=i.height; c.getContext('2d').drawImage(i,0,0); return c; };
    const out=[]; for (const r of recs){ const works=[]; for (const w of r.works||[]) works.push({canvas:await bm(w.png),time:w.time,style:w.style});
      out.push({n:r.n,canvas:await bm(r.png),time:r.time,works}); }
    return out;
  }catch(e){ return []; }
}
function samples(){
  const out=[], skies=[['#f2b78a','#7f8fb8'],['#9fc6e8','#e7eef4'],['#203a63','#e48a5c'],['#bcd8ee','#f3e3c3'],['#e9c48f','#c96f55'],['#7aa9d6','#d9ecf7']];
  skies.forEach(([a,b],i)=>{ const c=document.createElement('canvas'); c.width=i%3===1?900:1200; c.height=i%3===1?900:i%2?800:675; const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,0,c.height); gr.addColorStop(0,a); gr.addColorStop(1,b); g.fillStyle=gr; g.fillRect(0,0,c.width,c.height);
    g.fillStyle='#2f5f8f'; g.fillRect(0,c.height*0.62,c.width,c.height*0.38);
    g.fillStyle='#6d7a4c'; g.beginPath(); g.moveTo(0,c.height*0.7); for (let x=0;x<=c.width;x+=40) g.lineTo(x,c.height*(0.55-0.12*Math.sin(x/c.width*3+i))); g.lineTo(c.width,c.height*0.75); g.closePath(); g.fill();
    g.fillStyle='#efe6d6'; for (let k=0;k<6;k++) g.fillRect(c.width*(0.15+k*0.11),c.height*(0.5+0.03*(k%2)),c.width*0.07,c.height*0.1);
    out.push({n:i+1,canvas:c,time:i,works:i%2?[{canvas:c,time:100+i,style:'watercolour'}]:[]}); });
  return out;
}
let mine=null, G=null;
async function build(){
  const src=document.getElementById('src').value;
  if (!mine) mine=await loadMine();
  let set=src==='sample'?samples():mine;
  let pics=src==='photos'?pickPictures(set.map(p=>({...p,works:[]}))):pickPictures(set);
  if (!pics.length && src!=='sample'){ pics=pickPictures(samples()); stats.textContent='No pictures are stored in this browser; samples are shown.'; }
  else stats.textContent=`${pics.length} ${pics[0]&&pics[0].painting?'paintings':'photographs'} hung.`;
  if (G){ scene.remove(G.group); }
  G=buildArtGallery(pics,{lights:true}); scene.add(G.group);
}

const VIEWS={front:[[6,4.2,17],[0,3.2,0]],door:[[1.2,1.7,9.6],[0,2.3,4]],doors:[[0.3,1.8,7.4],[0,2.0,3.5]],sign:[[3.6,3.6,8.6],[0,4.2,6.2]],in:[[0,1.65,4.6],[0,1.6,-3]],
  back:[[0.6,1.65,-4.3],[0,1.4,3]],wall:[[-1.6,1.65,0.6],[3.6,1.6,-0.2]],air:[[13,16,18],[0,3,0]]};
function setView(v){ const [p,t]=VIEWS[v]; camera.position.set(...p); controls.target.set(...t); controls.update(); }
document.getElementById('view').onchange=e=>setView(e.target.value);
document.getElementById('src').onchange=build;
const hS=document.getElementById('h'), hV=document.getElementById('hV');
function setHour(){ const h=+hS.value, a=(h-6)/12*Math.PI, el=Math.sin(a)*1.05; hV.value=`${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round(h%1*60)).padStart(2,'0')}`;
  sun.position.set(Math.cos(a)*-30,Math.max(2,Math.sin(a)*40),18); sun.intensity=2.8*Math.max(0.1,Math.min(1,el*1.4)); hemi.intensity=0.4+0.6*Math.max(0,Math.min(1,el*1.5)); }
hS.oninput=setHour; setHour();

// a click on a picture: in the game this goes there
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let down=null;
canvas.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
canvas.addEventListener('pointerup',e=>{ if (!down || Math.hypot(e.clientX-down[0],e.clientY-down[1])>4 || !G) return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(G.pictures.map(p=>p.mesh))[0];
  if (hit){ const it=hit.object.userData.picture; stats.textContent=`Go there: Photo ${it.p.n}${it.w?' ('+it.w.style+')':''}`; } });
canvas.addEventListener('pointermove',e=>{ if (!G) return; ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera);
  canvas.style.cursor=ray.intersectObjects(G.pictures.map(p=>p.mesh)).length?'pointer':''; });

function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const q=new URLSearchParams(location.search); if (q.get('src')) document.getElementById('src').value=q.get('src'); if (q.get('view')) document.getElementById('view').value=q.get('view');
setView(document.getElementById('view').value);
await build();
renderer.setAnimationLoop(()=>{ controls.update(); renderer.render(scene,camera); });
window.__ready=true;
</script>
</body>
</html>
