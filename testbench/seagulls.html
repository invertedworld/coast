<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const hex=h=>new THREE.Color(h);

/* ================= seagulls =================
   Yellow-legged gulls (Larus michahellis): white head and body, mid-grey mantle and wings with a white trailing
   edge, black wing tips, a yellow bill with a red spot and yellow legs. About one in seven is a grey-brown immature bird.

   createGulls(parent, opts) adds one InstancedMesh to parent and returns
     { mesh, birds, thermals, update(dt, ctx), setCount(n), count, birdPosition(i, out), modeOf(i), shift(dx, dz),
       reset(), shoreDistance(x, z), inland, dispose() }.
   opts:  count (80), max (256), scale (1), range (240 m), shadows (true), random (Math.random),
          inland (70 m): how far inland of the shoreline a flying gull may go; a steering force towards the sea
            begins at a little over half that distance and grows smoothly to the limit,
          perchInland (40 m): land perches further than this from the water are not used,
          onCall({x,y,z,kind}) where kind is 'long', 'alarm' or 'mew'.
   ctx, passed to every update:
     player        {x,y,z} of the player (feet); gulls perched within a few metres of it take off
     daylight      0 at night to 1 by day; below about 0.35 the gulls settle to roost
     wind          {x,z} in m/s, the direction the air moves
     groundHeight  (x,z) => height of whatever is underfoot (terrain, quays, rocks); below seaLevel is sea
     seaLevel      0 in Coast
     boats         [{x,z,heading,speed,length}], heading as in rotation.y (the bow points along sin, cos); a boat
                   may also carry catch (true while it comes home with fish: the nearest gulls join it, up to want,
                   4-7, ahead of any other boat, and no more than half the flock in all), settle (true once it has berthed: its gulls come down on it or
                   near it) and perches ([{x,y,z}] on its deck and wheelhouse, for settling)
     perches       [{x,y,z}] places a gull may stand: rock tops, quay edges, bollards, ridges
     paused        while true the gulls hold still
     origin        optional {x,y,z} of the floating origin; the mesh is placed there and instances relative to it
     shoreDist     optional (x,z) => distance inland from the shoreline in metres (0 or less at sea); without it the
                   distance is found by sampling groundHeight in rings round the point
   The wings are posed in the vertex shader from four numbers per bird (shoulder and wrist angles, the sweep of the
   hand and how far the wings are folded), so a frame costs one draw call and a few hundred floats. */
function createGulls(parent, opts={}){
  const MAX=opts.max??256, SCALE=opts.scale??1, RANGE=opts.range??240, INLAND=opts.inland??70, PERCH_IN=opts.perchInland??40, R=opts.random??Math.random, onCall=opts.onCall??null;
  const TAU=Math.PI*2, cl=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=(k,h)=>1-Math.exp(-k*h);
  const wrap=a=>{ a=(a+Math.PI)%TAU; if (a<0) a+=TAU; return a-Math.PI; };
  const SOAR=0, GLIDE=1, FOLLOW=2, LAND=3, PERCH=4, TAKEOFF=5, MODES=['soar','glide','follow','land','perch','takeoff'];

  /* ---------- geometry: one bird, +z forward, +y up, in metres; aSeg 0 body, 1 arm, 2 hand, 3 legs ---------- */
  function buildGeometry(){
    const P=[], N=[], C=[], S=[], c=h=>new THREE.Color(h);
    const WHITE=c('#f4f2ed'), MANTLE=c('#a2abb5'), BLACK=c('#24242a'), BILL=c('#f0c23a'), RED=c('#c9362b'),
      LEG=c('#e3c04c'), EYE=c('#1d1d22'), UNDER=c('#eef0f0'), UNDERTIP=c('#4a4b52');
    function tri(a,b,cc,col,seg,hint){
      const ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2], vx=cc[0]-a[0], vy=cc[1]-a[1], vz=cc[2]-a[2];
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx; const l=Math.hypot(nx,ny,nz); if (l<1e-12) return;
      const mx=(a[0]+b[0]+cc[0])/3-hint[0], my=(a[1]+b[1]+cc[1])/3-hint[1], mz=(a[2]+b[2]+cc[2])/3-hint[2];
      if (nx*mx+ny*my+nz*mz<0){ const t=b; b=cc; cc=t; nx=-nx; ny=-ny; nz=-nz; }
      for (const p of [a,b,cc]){ P.push(p[0],p[1],p[2]); N.push(nx/l,ny/l,nz/l); C.push(col.r,col.g,col.b); S.push(seg); }
    }
    const quad=(a,b,cc,d,col,seg,hint)=>{ tri(a,b,cc,col,seg,hint); tri(a,cc,d,col,seg,hint); };
    function box(cx,cy,cz,sx,sy,sz,col,seg){
      const v=(i,j,k)=>[cx+i*sx/2,cy+j*sy/2,cz+k*sz/2], h=[cx,cy,cz];
      for (const [a,b,cc,d] of [[v(-1,-1,1),v(1,-1,1),v(1,1,1),v(-1,1,1)],[v(-1,-1,-1),v(1,-1,-1),v(1,1,-1),v(-1,1,-1)],
        [v(-1,1,-1),v(1,1,-1),v(1,1,1),v(-1,1,1)],[v(-1,-1,-1),v(1,-1,-1),v(1,-1,1),v(-1,-1,1)],
        [v(1,-1,-1),v(1,1,-1),v(1,1,1),v(1,-1,1)],[v(-1,-1,-1),v(-1,1,-1),v(-1,1,1),v(-1,-1,1)]]) quad(a,b,cc,d,col,seg,h);
    }
    // body, head and bill lofted through eight-sided rings: [z, half width, half height, centre height]
    const ST=[[-0.33,0.052,0.008,0.035],[-0.22,0.058,0.022,0.03],[-0.10,0.074,0.06,0.006],[0.03,0.082,0.075,0],
      [0.12,0.06,0.06,0.02],[0.17,0.046,0.05,0.06],[0.215,0.043,0.047,0.075],[0.252,0.027,0.031,0.069],
      [0.262,0.013,0.017,0.066],[0.298,0.009,0.013,0.061],[0.324,0.006,0.011,0.054]];
    const K=8, rings=ST.map(([z,w,h,y])=>Array.from({length:K},(_,k)=>{ const a=k/K*TAU; return [w*Math.sin(a),y+h*Math.cos(a),z]; }));
    for (let i=0;i<ST.length-1;i++){
      const hint=[0,(ST[i][3]+ST[i+1][3])/2,(ST[i][0]+ST[i+1][0])/2], hm=(ST[i][2]+ST[i+1][2])/2;
      for (let k=0;k<K;k++){
        const a=rings[i][k], b=rings[i][(k+1)%K], cc=rings[i+1][(k+1)%K], d=rings[i+1][k];
        const cy=(a[1]+b[1]+cc[1]+d[1])/4, cz=(a[2]+b[2]+cc[2]+d[2])/4, ny=(cy-hint[1])/hm;
        let col=WHITE;
        if (cz>0.262) col=(cz>0.29&&cz<0.315&&ny<-0.2)?RED:BILL;
        else if (ny>0.3&&cz>-0.2&&cz<0.09) col=MANTLE;
        quad(a,b,cc,d,col,0,hint);
      }
    }
    const tail=[0,0.035,-0.345], tip=[0,0.046,0.338];
    for (let k=0;k<K;k++){ tri(rings[0][k],rings[0][(k+1)%K],tail,WHITE,0,[0,0.035,-0.2]);
      tri(rings[ST.length-1][k],rings[ST.length-1][(k+1)%K],tip,BILL,0,[0,0.055,0.3]); }
    for (const s of [-1,1]){
      box(s*0.039,0.087,0.219,0.012,0.013,0.013,EYE,0);
      // legs, folded into the belly in flight; webbed feet
      box(s*0.03,-0.122,0.006,0.012,0.135,0.012,LEG,3);
      const f0=[s*0.03,-0.197,-0.004], f1=[s*0.06,-0.197,0.066], f2=[s*0.002,-0.197,0.066];
      tri(f0,f1,f2,LEG,3,[s*0.03,-0.3,0.04]); tri(f0,f1,f2,LEG,3,[s*0.03,0,0.04]);
      // wing: stations along the span [x, leading edge z, trailing edge z, raised spar height]
      const W=[[0.05,0.075,-0.11,0.015],[0.2,0.085,-0.12,0.013],[0.34,0.07,-0.125,0.011],[0.54,-0.005,-0.13,0.008],[0.72,-0.072,-0.088,0.002]];
      const y0=0.035;
      for (let i=0;i<W.length-1;i++){
        const A=W[i], B=W[i+1], seg=i<2?1:2, tipPart=i===3;
        const pt=(St,f,top)=>{ const le=St[1], te=St[2], z=le+(te-le)*f; const y=top?y0+St[3]*(f<0.3?f/0.3:(1-f)/0.7):y0-0.003; return [s*St[0],y,z]; };
        const strip=st=>1-0.026/Math.max(0.03,st[1]-st[2]);
        const fA=[0,0.3,strip(A),1], fB=[0,0.3,strip(B),1];
        const up=[s*(A[0]+B[0])/2,y0-0.2,(A[1]+A[2])/2];
        for (let j=0;j<3;j++){
          const col=tipPart?BLACK:(j===2?WHITE:MANTLE);
          quad(pt(A,fA[j],true),pt(B,fB[j],true),pt(B,fB[j+1],true),pt(A,fA[j+1],true),col,seg,up);
        }
        quad(pt(A,0,false),pt(B,0,false),pt(B,1,false),pt(A,1,false),tipPart?UNDERTIP:UNDER,seg,[up[0],y0+0.2,up[2]]);
        // the leading and trailing edges are closed so the wing has a little thickness when seen edge on
        if (i===0) tri(pt(A,0,true),pt(A,0.3,true),pt(A,1,true),WHITE,seg,[s*0.5,y0,0]);
      }
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
    g.setAttribute('aSeg',new THREE.Float32BufferAttribute(S,1));
    g.computeBoundingSphere();
    return g;
  }

  const GLSL_DEFORM=`
    attribute vec4 iWing; attribute float iLeg; attribute float aSeg;
    void gullRot(inout vec2 v,float a){ float c=cos(a), s=sin(a); v=vec2(c*v.x-s*v.y, s*v.x+c*v.y); }
    void gullDeform(inout vec3 p, inout vec3 n){
      if (aSeg>2.5){ p=mix(vec3(p.x*0.5,-0.03,0.0),p,iLeg); return; }
      if (aSeg<0.5) return;
      float s=sign(p.x);
      vec3 sh=vec3(s*0.05,0.035,0.0), q=p-sh, m=n;
      if (aSeg>1.5){
        vec3 w=vec3(s*0.29,0.0,0.0), r=q-w; float k=tan(iWing.z);
        r.z-=abs(r.x)*k; m.x+=k*s*m.z;
        vec2 a=r.xy; gullRot(a,s*iWing.y); r.xy=a; a=m.xy; gullRot(a,s*iWing.y); m.xy=a;
        q=w+r;
      }
      vec2 a=q.xy; gullRot(a,s*iWing.x); q.xy=a; a=m.xy; gullRot(a,s*iWing.x); m.xy=a;
      vec3 spread=sh+q;
      // folded: the wing lies back along the body, upper side out, the black primaries crossing over the tail
      float u=abs(p.x)-0.05, c=p.z, t=p.y-0.035;
      vec3 nF=vec3(s*0.55,0.835,0.0), cF=vec3(s*0.835,-0.55,0.0), sF=normalize(vec3(0.0,-0.09,-1.0));
      vec3 folded=vec3(s*0.066,0.058,0.05)+sF*(u*0.58)+cF*(c*0.45)+nF*t-vec3(s*u*0.062,0.0,0.0);
      vec3 nFold=sF*(n.x*s)+nF*n.y+cF*n.z;
      p=mix(spread,folded,iWing.w);
      n=normalize(mix(normalize(m),nFold,iWing.w));
    }`;
  function patch(sh,lit){
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\n'+GLSL_DEFORM);
    if (lit) sh.vertexShader=sh.vertexShader
      .replace('#include <beginnormal_vertex>','vec3 objectNormal=vec3(normal); vec3 gP=vec3(position); gullDeform(gP,objectNormal);')
      .replace('#include <begin_vertex>','vec3 transformed=gP;');
    else sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>','vec3 gP=vec3(position), gN=vec3(0.0,1.0,0.0); gullDeform(gP,gN); vec3 transformed=gP;');
  }

  const geo=buildGeometry();
  const wingA=new THREE.InstancedBufferAttribute(new Float32Array(MAX*4),4).setUsage(THREE.DynamicDrawUsage);
  const legA=new THREE.InstancedBufferAttribute(new Float32Array(MAX),1).setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('iWing',wingA); geo.setAttribute('iLeg',legA);
  const mat=new THREE.MeshLambertMaterial({vertexColors:true}); mat.onBeforeCompile=sh=>patch(sh,true);
  mat.customProgramCacheKey=()=>'gull';
  const depth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking}); depth.onBeforeCompile=sh=>patch(sh,false);
  depth.customProgramCacheKey=()=>'gullDepth';
  const mesh=new THREE.InstancedMesh(geo,mat,MAX);
  mesh.customDepthMaterial=depth; mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled=false; mesh.castShadow=opts.shadows??true; mesh.receiveShadow=false; mesh.count=0;
  const ADULT=new THREE.Color(1,1,1), JUV=new THREE.Color('#a29d97');   // a cool grey-brown: a warm tan turned orange in low sun
  for (let i=0;i<MAX;i++) mesh.setColorAt(i,ADULT);
  parent.add(mesh);

  /* ---------- state ---------- */
  const birds=[], thermals=[], taken=new Set();
  let t=0, lastCtx=null, want=Math.min(opts.count??80,MAX), catchT=0;
  const ground=(ctx,x,z)=>ctx.groundHeight?ctx.groundHeight(x,z):-10;
  const sea=ctx=>ctx.seaLevel??0;
  const day=ctx=>ctx.daylight??1;
  const W=ctx=>ctx.wind??{x:0,z:0};

  /* ---------- the shore ---------- */
  // distance inland from the shoreline (0 at sea) and the direction towards the nearest sea, into out {d, sx, sz, ok}
  const DIRS=Array.from({length:12},(_,k)=>[Math.cos(k/12*TAU),Math.sin(k/12*TAU)]);
  function shoreProbe(ctx,x,z,out={}){
    const sl=sea(ctx);
    if (ctx.shoreDist){
      const f=ctx.shoreDist, e=4, gx=f(x+e,z)-f(x-e,z), gz=f(x,z+e)-f(x,z-e), l=Math.hypot(gx,gz);
      out.d=Math.max(0,f(x,z)); out.ok=l>1e-6; if (out.ok){ out.sx=-gx/l; out.sz=-gz/l; } return out;
    }
    if (ground(ctx,x,z)<=sl){ out.d=0; out.ok=false; return out; }
    const step=10, maxR=INLAND+60;
    for (let r=step;r<=maxR;r+=step){
      let sx=0, sz=0, n=0;
      for (const [cx,cz] of DIRS) if (ground(ctx,x+cx*r,z+cz*r)<=sl){ sx+=cx; sz+=cz; n++; }
      if (!n) continue;
      const l=Math.hypot(sx,sz); if (l<1e-6){ out.d=r; out.ok=false; return out; }
      const ux=sx/l, uz=sz/l; let lo=r-step, hi=r;
      for (let k=0;k<4;k++){ const m=(lo+hi)/2; if (ground(ctx,x+ux*m,z+uz*m)<=sl) hi=m; else lo=m; }
      out.d=(lo+hi)/2; out.sx=ux; out.sz=uz; out.ok=true; return out;
    }
    out.d=maxR+step; out.ok=false; return out;
  }
  const _pr={};
  // whether there is land within reach of a point at sea: thermals and circling centres keep close to the coast
  function nearLand(ctx,x,z,r){ const sl=sea(ctx); for (const rr of [r*0.5,r]) for (const [cx,cz] of DIRS) if (ground(ctx,x+cx*rr,z+cz*rr)>sl) return true; return false; }
  function inBand(ctx,x,z,maxIn){ const pr=shoreProbe(ctx,x,z,_pr); return pr.d>0?pr.d<=maxIn:nearLand(ctx,x,z,35); }
  // a place in the shore band near the player, searching further out if there is none close by
  function bandSpot(ctx,maxIn){
    const p=ctx.player;
    for (let k=0;k<60;k++){ const a=R()*TAU, r=10+R()*(k<30?RANGE*0.35:RANGE*1.2), x=p.x+Math.cos(a)*r, z=p.z+Math.sin(a)*r;
      if (inBand(ctx,x,z,maxIn)) return {x,z}; }
    // out at sea, away from any shore (on a ferry, say), the gulls circle over the open water near the player
    for (let k=0;k<30;k++){ const a=R()*TAU, r=20+R()*RANGE*0.3, x=p.x+Math.cos(a)*r, z=p.z+Math.sin(a)*r;
      if (shoreProbe(ctx,x,z,_pr).d<=0 && ground(ctx,x,z)<sea(ctx)-1) return {x,z}; }
    return null;
  }
  function newThermal(ctx,T){
    // the circle, at most 1.2 times the thermal's radius, stays inside the inland limit
    const r=15+R()*13, s=bandSpot(ctx,Math.max(5,INLAND*0.45-r*0.5));
    if (!s && T) { T.life=20; return T; }
    const at=s||{x:ctx.player.x,z:ctx.player.z};
    return Object.assign(T||{},{x:at.x,z:at.z,r,dir:R()<0.5?1:-1,top:14+R()*20,lift:0.9+R()*0.8,life:70+R()*120,chk:R(),gen:((T&&T.gen)||0)+1});
  }
  function nearestThermal(b,except){
    let best=null, bd=Infinity;
    for (const T of thermals){ if (T===except) continue; const d=Math.hypot(T.x-b.x,T.z-b.z)+R()*40; if (d<bd){ bd=d; best=T; } }
    return best||thermals[0];
  }
  function waterSpot(ctx,cx,cz,rMin,rMax){
    for (let k=0;k<40;k++){ const a=R()*TAU, r=rMin+R()*(rMax-rMin), x=cx+Math.cos(a)*r, z=cz+Math.sin(a)*r, g=ground(ctx,x,z)-sea(ctx);
      if (g<-1.2 && (g>-30 || k>=20)) return {x,y:sea(ctx),z,water:true}; }
    return null;
  }
  // land perches are used only near the water; the answer is kept for each perch object
  const perchNear=new WeakMap();
  function perchOK(ctx,q){ let v=perchNear.get(q); if (v===undefined){ v=shoreProbe(ctx,q.x,q.z,_pr).d<=PERCH_IN; perchNear.set(q,v); } return v; }
  function pickPerch(b,ctx){
    const p=ctx.player, list=ctx.perches||[], roost=day(ctx)<0.35;
    if (R()<(roost?0.5:0.35)){ const w=waterSpot(ctx,b.x,b.z,10,90)||waterSpot(ctx,p.x,p.z,15,RANGE*0.6); if (w) return w; }
    let best=null, bs=-Infinity;
    for (let k=0;k<24&&list.length;k++){ const q=list[(R()*list.length)|0]; if (taken.has(q)||!perchOK(ctx,q)) continue;
      const d=Math.hypot(q.x-b.x,q.z-b.z), dp=Math.hypot(q.x-p.x,q.z-p.z); if (dp<b.scareR+4||d>150) continue;
      const sc=-d*0.025-dp*0.004+R(); if (sc>bs){ bs=sc; best=q; } }
    if (best) return best;

    rings.push([[-b,top],[-0.97*b,0.4*top],[-0.6*b,0.6*kb],[0,kb],[0.6*b,0.6*kb],[0.97*b,0.4*top],[b,top]].map(([x,y])=>[x,y,z])); }
  for (let i=0;i<N;i++){ const hint=[0,0.3,(rings[i][0][2]+rings[i+1][0][2])/2];
    for (let k=0;k<6;k++){ const a=rings[i][k], b=rings[i][k+1], c=rings[i+1][k+1], d=rings[i+1][k], ym=(a[1]+b[1]+c[1]+d[1])/4;
      const col=(k===0||k===5)?band:(ym<0.05?anti:hull); tri(a,b,c,col,hint); tri(a,c,d,col,hint); }
    const fy=Math.min(rings[i][0][1],rings[i+1][0][1])-0.18, a=rings[i][1], d=rings[i+1][1];
    tri([a[0],fy,a[2]],[-a[0],fy,a[2]],[-d[0],fy,d[2]],wood,[0,-5,a[2]]); tri([a[0],fy,a[2]],[-d[0],fy,d[2]],[d[0],fy,d[2]],wood,[0,-5,a[2]]); }
  const r0=rings[0], tc=[0,(r0[0][1]+r0[3][1])/2,r0[0][2]];
  for (let k=0;k<6;k++) tri(tc,r0[k],r0[k+1],k===0||k===5?band:hull,[0,tc[1],tc[2]+1]);
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(Cc,3)); g.computeVertexNormals();
  const grp=new THREE.Group(), m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})); m.castShadow=true; grp.add(m);
  const add=(geo,col,x,y,z)=>{ const o=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col})); o.position.set(x,y,z); o.castShadow=true; grp.add(o); return o; };
  add(new THREE.BoxGeometry(1.9,1.75,2.2),white,0,0.95+0.87,-0.9);
  add(new THREE.BoxGeometry(1.95,0.42,1.7),glass,0,2.25,-0.9).scale.set(1.01,1,0.9);
  add(new THREE.BoxGeometry(2.15,0.12,2.5),hex('#c4544b'),0,2.76,-0.9);
  add(new THREE.CylinderGeometry(0.07,0.07,5.4,8),hex('#e9e4da'),0,3.7,1.5);
  add(new THREE.BoxGeometry(1.8,0.08,0.08),hex('#e9e4da'),0,5.2,1.5);
  return {grp,L};
}
const boatObj=boatGeometry(); scene.add(boatObj.grp);
const boat={x:0,z:0,heading:0,speed:3.2,length:boatObj.L,s:0};
const BOAT_PATH=s=>[10+170*Math.cos(s),150+60*Math.sin(s)];
function updateBoat(dt){
  const [x0,z0]=BOAT_PATH(boat.s), [x1,z1]=BOAT_PATH(boat.s+0.001), dl=Math.hypot(x1-x0,z1-z0)/0.001;
  boat.s+=boat.speed*dt/dl;
  const [x,z]=BOAT_PATH(boat.s), [xa,za]=BOAT_PATH(boat.s+0.01);
  boat.x=x; boat.z=z; boat.heading=Math.atan2(xa-x,za-z);
  boatObj.grp.position.set(x,0.05*Math.sin(simTime*1.2),z); boatObj.grp.rotation.set(0.03*Math.sin(simTime*0.9),boat.heading,0.04*Math.sin(simTime*0.7),'YXZ');
}

// the player: a figure that may be dragged about, or walked towards the nearest perched gulls
const HOME=new THREE.Vector3(-50,0,-2); HOME.y=groundHeight(HOME.x,HOME.z);
const player=HOME.clone();
const playerObj=new THREE.Group();
{ const m=new THREE.MeshLambertMaterial({color:hex('#c4544b')}), skin=new THREE.MeshLambertMaterial({color:hex('#e0b48f')});
  const b=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.26,1.35,10),m); b.position.y=0.68; b.castShadow=true;
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.17,12,8),skin); h.position.y=1.55; h.castShadow=true;
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.7,0.9,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:hex('#f7f3ec'),transparent:true,opacity:0.8,depthWrite:false}));
  ring.position.y=0.05; playerObj.add(b,h,ring); scene.add(playerObj); }
const hitProxy=new THREE.Mesh(new THREE.SphereGeometry(1.6,8,6),new THREE.MeshBasicMaterial({visible:false})); playerObj.add(hitProxy); hitProxy.position.y=0.9;

/* ================= gulls in the scene ================= */
let audio=null, callsOn=false;
function gullCall(e){
  if (!callsOn||!audio) return;
  const now=audio.currentTime, pan=audio.createPanner(); pan.panningModel='HRTF'; pan.distanceModel='inverse'; pan.refDistance=12; pan.rolloffFactor=1.2;
  pan.positionX.value=e.x; pan.positionY.value=e.y; pan.positionZ.value=e.z; pan.connect(audio.destination);
  const notes=e.kind==='alarm'?3:e.kind==='long'?4+((Math.random()*4)|0):1, base=1050+Math.random()*250;
  for (let k=0;k<notes;k++){
    const t0=now+k*(e.kind==='alarm'?0.13:0.24)+(e.kind==='long'&&k===0?0:0), dur=e.kind==='alarm'?0.09:e.kind==='mew'?0.45:k===0?0.32:0.17;
    const o=audio.createOscillator(), o2=audio.createOscillator(), f=audio.createBiquadFilter(), g=audio.createGain();
    o.type='sawtooth'; o2.type='square'; f.type='bandpass'; f.frequency.value=2300; f.Q.value=1.6;
    const f0=base*(e.kind==='long'&&k===0?1.25:1), f1=f0*(e.kind==='mew'?0.7:0.78);
    for (const os of [o,o2]){ os.frequency.setValueAtTime(f0*(os===o2?1.004:1),t0); os.frequency.exponentialRampToValueAtTime(f1,t0+dur); os.connect(f); os.start(t0); os.stop(t0+dur+0.05); }
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.16,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    f.connect(g); g.connect(pan);
  }
}
const gulls=createGulls(scene,{count:16,range:170,onCall:gullCall});

/* ---------- tracks: where every gull has been over the last minute, and the inland limit ---------- */
const TRACK_N=120, trackPos=new Float32Array(256*TRACK_N*3), trackCol=new Float32Array(256*TRACK_N*3);
const trackGeo=new THREE.BufferGeometry(); trackGeo.setAttribute('position',new THREE.BufferAttribute(trackPos,3)); trackGeo.setAttribute('color',new THREE.BufferAttribute(trackCol,3));
trackGeo.setDrawRange(0,0);
const tracks=new THREE.Points(trackGeo,new THREE.PointsMaterial({size:4,sizeAttenuation:false,vertexColors:true,depthTest:false,transparent:true,opacity:0.9,fog:false}));
tracks.frustumCulled=false; tracks.renderOrder=5; tracks.visible=false; scene.add(tracks);
const MODE_COL={soar:hex('#e8f1ff'),glide:hex('#9fd3ff'),follow:hex('#ffd34d'),land:hex('#ff9a5a'),perch:hex('#ff5a4d'),takeoff:hex('#c58bff')};
let trackHead=0, trackT=0, trackFill=0;
function recordTracks(dt){
  trackT+=dt; if (trackT<0.5) return; trackT=0;
  const n=gulls.birds.length;
  for (let i=0;i<n;i++){ const b=gulls.birds[i], o=((trackHead*256)+i)*3, c=MODE_COL[gulls.modeOf(i)];
    trackPos[o]=b.x; trackPos[o+1]=b.y; trackPos[o+2]=b.z; trackCol[o]=c.r; trackCol[o+1]=c.g; trackCol[o+2]=c.b; }
  for (let i=n;i<256;i++){ const o=((trackHead*256)+i)*3; trackPos[o]=trackPos[o+1]=trackPos[o+2]=0; trackPos[o+1]=-1e4; }
  trackHead=(trackHead+1)%TRACK_N; trackFill=Math.min(TRACK_N,trackFill+1);
  trackGeo.setDrawRange(0,trackFill*256); trackGeo.attributes.position.needsUpdate=true; trackGeo.attributes.color.needsUpdate=true;
}
// the inland limit, found the way the gulls find it, drawn on the ground
let limitLine=null;
function buildLimitLine(){
  const pts=[];
  for (let x=-480;x<=480;x+=6){ let z=shoreZ(x); while (z>shoreZ(x)-400 && gulls.shoreDistance(x,z)<gulls.inland) z-=3; pts.push(new THREE.Vector3(x,groundHeight(x,z)+0.6,z)); }
  limitLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:hex('#c4544b'),depthTest:false,fog:false}));
  limitLine.renderOrder=6; limitLine.visible=tracks.visible; scene.add(limitLine);
}

/* ================= controls and loop ================= */
const $=id=>document.getElementById(id);
let paused=false, walking=false, wind={x:0,z:0}, simTime=0, view='overview', focus=-1;
function setWind(){ const s=+$('w').value, a=+$('wd').value*Math.PI/180; // compass bearing the wind blows from, north = -z
  wind={x:-Math.sin(a)*s,z:Math.cos(a)*s}; $('wV').textContent=`${s} m/s`; $('wdV').textContent=`${$('wd').value}°`; }
function setHour(){ hour=+$('h').value; const hh=Math.floor(hour), mm=Math.round((hour-hh)*60/5)*5;
  $('hV').textContent=`${String(hh+(mm===60)).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`; updateDaylight(); }
$('n').oninput=()=>{ $('nV').textContent=$('n').value; gulls.setCount(+$('n').value); };
$('w').oninput=$('wd').oninput=setWind; $('h').oninput=setHour;
function setPaused(p){ paused=p; $('pause').classList.toggle('on',p); $('pause').textContent=p?'Resume':'Pause'; }
$('pause').onclick=()=>setPaused(!paused);
addEventListener('keydown',e=>{ if (e.code==='KeyP') setPaused(!paused); });
$('walk').onclick=()=>{ walking=!walking; $('walk').classList.toggle('on',walking); $('walk').textContent=walking?'Stop':'Walk to gulls'; };
$('reset').onclick=()=>{ player.copy(HOME); walking=false; $('walk').classList.remove('on'); $('walk').textContent='Walk to gulls'; };
$('calls').onclick=()=>{ callsOn=!callsOn; if (callsOn&&!audio) audio=new AudioContext(); if (audio) audio.resume();
  $('calls').classList.toggle('on',callsOn); $('calls').textContent=callsOn?'Calls on':'Calls off'; };
const camPrev=new THREE.Vector3(), birdNow=new THREE.Vector3();
function pickBird(kind){
  const want={flying:['soar','glide'],perched:['perch'],following:['follow']}[kind]; if (!want) return -1;
  const n=gulls.birds.length, start=(focus+1)%n;
  for (let k=0;k<n;k++){ const i=(start+k)%n; if (want.includes(gulls.modeOf(i))) return i; }
  return (start)%n;
}
function setView(v){ view=v; $('view').value=v;
  if (v==='overview'){ focus=-1; camera.position.set(-26,5,50); controls.target.set(-60,13,-6);
    // aim between the root of the quay and the nearest thermal, so the circling gulls are in the picture
    const T=gulls.thermals.reduce((m,t)=>!m||Math.hypot(t.x-player.x,t.z-player.z)<Math.hypot(m.x-player.x,m.z-player.z)?t:m,null);
    if (T){ controls.target.set((T.x-63)/2,4+T.top*0.4,(T.z-6)/2); camera.position.set(controls.target.x+30,5,52); } controls.minDistance=0; return; }
  focus=pickBird(v); if (focus<0) return;
  gulls.birdPosition(focus,birdNow); const b=gulls.birds[focus];
  const fx=Math.sin(b.psi), fz=Math.cos(b.psi);
  camera.position.set(birdNow.x-fx*1.6+fz*1.3,birdNow.y+0.55,birdNow.z-fz*1.6-fx*1.3);
  controls.target.copy(birdNow); controls.minDistance=0.4; camPrev.copy(birdNow); }
function setTracks(on){ tracks.visible=on; if (on&&!limitLine) buildLimitLine(); if (limitLine) limitLine.visible=on;
  $('tracks').classList.toggle('on',on); $('tracks').textContent=on?'Tracks on':'Tracks off'; }
$('tracks').onclick=()=>setTracks(!tracks.visible);
// a boat coming home with its catch: up to twelve gulls crowd round it
$('catch').onclick=()=>{ boat.catch=!boat.catch; boat.want=12; $('catch').classList.toggle('on',boat.catch); $('catch').textContent=boat.catch?'Catch on':'Catch off'; };
$('view').onchange=()=>setView($('view').value);
$('next').onclick=()=>{ if (view==='overview') setView('flying'); else setView(view); };

// dragging the player
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); let dragging=false;
function toNdc(e){ const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); }
canvas.addEventListener('pointerdown',e=>{ toNdc(e); ray.setFromCamera(ndc,camera); if (ray.intersectObject(hitProxy).length){ dragging=true; controls.enabled=false; canvas.setPointerCapture(e.pointerId); } });
canvas.addEventListener('pointermove',e=>{ if (!dragging) return; toNdc(e); ray.setFromCamera(ndc,camera);
  // march along the ray to the ground
  const o=ray.ray.origin, d=ray.ray.direction; for (let s=0;s<800;s+=0.5){ const x=o.x+d.x*s, y=o.y+d.y*s, z=o.z+d.z*s; if (y<=Math.max(groundHeight(x,z),0)){ player.set(x,0,z); break; } } });
canvas.addEventListener('pointerup',()=>{ dragging=false; controls.enabled=true; });

function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

const ctx={player,daylight:1,wind,groundHeight,seaLevel:0,boats:[boat],perches:PERCHES,paused:false};
function stepWorld(dt){
  const wdt=paused?0:dt; simTime+=wdt; seaU.uTime.value=simTime;
  if (!paused) updateBoat(wdt);
  if (walking){ let best=null, bd=1e9;
    for (let i=0;i<gulls.birds.length;i++){ const b=gulls.birds[i]; if (gulls.modeOf(i)!=='perch'||(b.perch&&b.perch.water)) continue; const d=Math.hypot(b.x-player.x,b.z-player.z); if (d<bd){ bd=d; best=b; } }
    if (best && bd>0.8){ player.x+=(best.x-player.x)/bd*1.6*dt; player.z+=(best.z-player.z)/bd*1.6*dt; } }
  player.y=Math.max(groundHeight(player.x,player.z),0);
  playerObj.position.copy(player); if (walking) playerObj.rotation.y+=0;
  Object.assign(ctx,{daylight,wind,paused});
  gulls.update(dt,ctx); if (!paused) recordTracks(dt);
  if (focus>=0 && focus<gulls.birds.length){ gulls.birdPosition(focus,birdNow); camera.position.add(birdNow.clone().sub(camPrev)); controls.target.copy(birdNow); camPrev.copy(birdNow); }
}
let fpsT=0, fpsN=0, fps=0;
function stats(dt){
  fpsT+=dt; fpsN++; if (fpsT>0.5){ fps=Math.round(fpsN/fpsT); fpsT=fpsN=0;
    const m={}; for (let i=0;i<gulls.birds.length;i++){ const k=gulls.modeOf(i); m[k]=(m[k]||0)+1; }
    $('stats').textContent=`Soaring ${m.soar||0} · gliding ${m.glide||0} · following ${m.follow||0} · landing ${m.land||0} · perched ${m.perch||0} · taking off ${m.takeoff||0} · ${fps} fps`; }
}
let last=performance.now(), frozen=false;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if (!frozen){ stepWorld(dt); stats(dt); }
  controls.update(); renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
setWind(); setHour(); ctx.wind=wind;
requestAnimationFrame(frame);

// for automated checks: freeze the loop and advance the world by fixed steps
window.tb={gulls,camera,controls,player,boat,setView,ctx,setTracks,
  freeze(f=true){ frozen=f; },
  run(sec,h=1/60){ for (let s=0;s<sec;s+=h) stepWorld(h); controls.update(); renderer.render(scene,camera); },
  setHour(h){ $('h').value=h; setHour(); }, setWind(s,from){ $('w').value=s; $('wd').value=from; setWind(); },
  setCount(n){ $('n').value=n; $('n').oninput(); }, walk(on){ if (walking!==on) $('walk').onclick(); }, pause(p){ setPaused(p); },
  look(px,py,pz,tx,ty,tz){ focus=-1; camera.position.set(px,py,pz); controls.target.set(tx,ty,tz); controls.update(); },
  focusBird(i){ focus=i; gulls.birdPosition(i,birdNow); camPrev.copy(birdNow); controls.target.copy(birdNow); },
  modes(){ const m={}; for (let i=0;i<gulls.birds.length;i++){ const k=gulls.modeOf(i); m[k]=(m[k]||0)+1; } return m; },
};
</script>
