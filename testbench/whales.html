<style>
/* The testbench uses the panel style of Coast: plaster text on a translucent sea-blue panel. */
:root{
  --sea:#1d5189; --sea-deep:#123761; --plaster:#f5e9d7; --plaster-dim:#d9c8b0;
  --coral:#d85d52; --verdigris:#7cc3ad; --ink:#26232b;
  --panel:rgba(18,55,97,.86); --line:rgba(245,233,215,.22);
  --font-display:'Marcellus','Trajan Pro',Georgia,serif;
  --font-body:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);color:var(--plaster);font-family:var(--font-body);font-size:16px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{position:fixed;z-index:4;top:16px;left:16px;width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;backdrop-filter:blur(8px);font-size:.95rem;line-height:1.3}
.panel h1{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.panel .row{display:grid;grid-template-columns:6.6em 1fr 5.2em;align-items:center;gap:8px;padding:5px 0}
.panel .row.two{grid-template-columns:6.6em 1fr}
.panel label{color:var(--plaster-dim)}
.panel output{text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem}
.panel input[type=range]{width:100%;accent-color:var(--verdigris)}
.panel input[type=checkbox]{accent-color:var(--verdigris);width:18px;height:18px;margin:0}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;border-radius:0;border:0;padding:7px 4px}
button{font:500 .9rem/1 var(--font-body);color:var(--plaster);background:rgba(245,233,215,.08);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--plaster);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions button{flex:1 1 40%}
.state{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:.9rem;color:var(--plaster-dim);display:flex;justify-content:space-between;gap:8px}
.state b{font-weight:500;color:var(--plaster)}
[hidden]{display:none!important}
</style>

<canvas id="scene" tabindex="0" aria-label="Whales testbench"></canvas>
<aside class="panel" id="panel" aria-label="Whale settings">
  <h1>Whales</h1>
  <div class="row two"><label>Species</label><div class="seg"><button id="sp-blue" aria-pressed="false">Blue</button><button id="sp-fin" aria-pressed="false">Fin</button><button id="sp-humpback" aria-pressed="true">Humpback</button><button id="sp-sperm" aria-pressed="false">Sperm</button></div></div>
  <div class="row"><label for="count">Whales</label><input id="count" type="range" min="1" max="6" step="1" value="2"><output id="countV">2</output></div>
  <div class="row"><label for="dive">Dive</label><input id="dive" type="range" min="0.5" max="12" step="0.5" value="1.5"><output id="diveV">1.5 min</output></div>
  <div class="row"><label for="breaths">Breaths</label><input id="breaths" type="range" min="2" max="12" step="1" value="5"><output id="breathsV">5</output></div>
  <div class="row"><label for="breach">Breaches</label><input id="breach" type="range" min="0" max="30" step="1" value="8"><output id="breachV">8 /h</output></div>
  <div class="row two"><label for="dinghy">Dinghy</label><input id="dinghy" type="checkbox" checked></div>
  <div class="row two"><label>Time of day</label><div class="seg"><button id="day" aria-pressed="true">Day</button><button id="dusk" aria-pressed="false">Dusk</button></div></div>
  <div class="actions">
    <button id="surface">Surface</button>

    <button id="pause" aria-pressed="false">Pause</button>
    <button id="follow" aria-pressed="false">Follow a whale</button>
    <button id="next" hidden>Next whale</button>
  </div>
  <div class="state" id="state" hidden><span id="stName"></span><b id="stVal"></b></div>
</aside>

<script type="module">

           before a breaching whale lands, for a sound whose crash comes that far in); onSplash(x, z, strength, length, heading):
           a whale has fallen back after a breach, its body centred on (x,z) and lying along heading, with the
           strength of its fall (about 1) and its length in metres

                                           height there, optional), bright (0..1, the light on blows and foam), paused,

   placed every frame along a bending spine: while it swims the spine follows the path its head has taken, so that

  /* ---------- the geometry of a species: triangles in local coordinates (x left, y up, z = -s), with each vertex's
     place along the body kept to bend it ---------- */
  const NA=16, geoCache={};
  const profileAt=(T,s)=>{ if (s<=T[0][0]) return T[0]; for (let i=1;i<T.length;i++) if (s<=T[i][0]){ const a=T[i-1], b=T[i], t=(s-a[0])/(b[0]-a[0]); return a.map((v,k)=>v+(b[k]-v)*t); } return T[T.length-1]; };
  const hash=(a,b)=>{ const x=Math.sin(a*127.1+b*311.7)*43758.5453; return x-Math.floor(x); };
  const vnoise=(x,y)=>{ const i=Math.floor(x), j=Math.floor(y), f=x-i, g=y-j, u=f*f*(3-2*f), v=g*g*(3-2*g);
    return (hash(i,j)*(1-u)+hash(i+1,j)*u)*(1-v)+(hash(i,j+1)*(1-u)+hash(i+1,j+1)*u)*v; };
  function buildSpecies(key){
    if (geoCache[key]) return geoCache[key];
    const S=SPECIES[key], L=S.L, T=S.body, c={}; for (const k in S.col) c[k]=C(S.col[k]);
    const P=[], Cc=[];
    const tri=(a,b,d,dir,ca,cb,cd)=>{

    if (ctx.gustU){ U.uGust.value.copy(ctx.gustU.uGust.value); U.uGustC.value=ctx.gustU.uGustC.value; U.uGustAmt.value=ctx.gustU.uGustAmt.value; }
    if (ctx.sunDir) U.uSunDir.value.copy(ctx.sunDir); if (ctx.sunColor) U.uSunCol.value.copy(ctx.sunColor);
    if (ctx.skyTop) U.uSkyTop.value.copy(ctx.skyTop); if (ctx.skyHorizon) U.uSkyHor.value.copy(ctx.skyHorizon);
    U.uBright.value=ctx.bright??1;
    // the scene behind the water, drawn without the sea: its colour and depth (ctx.behind {texture, depthTexture, width, height})
    if (ctx.behind && ctx.camera){ const B=ctx.behind; U.uScene.value=B.texture; U.uSceneDepth.value=B.depthTexture; U.uRes.value.set(B.width,B.height);
      U.uProjInv.value=ctx.camera.projectionMatrixInverse; U.uCamWorld.value=ctx.camera.matrixWorld; U.uPassFar.value=ctx.camera.far; U.uHasScene.value=1; } else U.uHasScene.value=0;
    if (O.clarity) U.uClarity.value=O.clarity;
    // ctx.detail: 1 for the full sea, 0 for the coarse one; it is eased towards over about a second
    const dT=ctx.detail??1; st.detail=dt>0?st.detail+cl(dT-st.detail,-dt,dt):dT; if (ctx.paused && dt===0) st.detail=dT;
    U.uDetail.value=st.detail; U.uSpc.value=spcC+(spcF-spcC)*st.detail; mesh.geometry=st.detail>0?geo:geoC;
    if (O.gust && !ctx.gustU){ U.uGust.value.copy(O.gust.uniforms.uGust.value); U.uGustAmt.value=O.gust.uniforms.uGustAmt.value; }
    writeComponents(); writeRings();
  }
  function setOptions(o){ Object.assign(O,o); if (o.outside) U.uOutside.value.set(...o.outside); }
  function info(){ return {hs:st.hs,lp:st.lp,tp:st.tp,u:st.U,Q:st.Q}; }
  function setWireframe(on){ mat.wireframe=!!on; }
  function dispose(){ parent.remove(mesh); geo.dispose(); if (geoC!==geo) geoC.dispose(); mat.dispose(); if (F) F.tex.dispose(); }
  rebuildField(); writeComponents();
  return {mesh,update,addRing,get rings(){ return RINGS; },setWind,setSwell,setOptions,rebuildField,setFieldData,moveField,fieldAt,setWireframe,sample,heightAt,normalAt,info,glsl:GLSL,uniforms:U,dispose};
}
/* ================= end of sea ================= */

// the sea of Coast, as in the game: a moderate wind sea on a long swell, in open water
const SEAS=createSea(scene,{radius:3000,rings:420,segs:400});
SEAS.setWind(5.5,0.4,true); SEAS.setSwell(0.8,0.9);
const seaH=(x,z)=>SEAS.heightAt(x,z);

/* ================= a sailing dinghy, hove to, for the size of the whales ================= */
const dinghy=createDinghy(scene,{number:'',x:0,z:0,head:0.6});
dinghy.state.x=0; dinghy.state.z=0; dinghy.state.head=0.6;
// it rides the sea: heave from the mean of four points round the hull, pitch and roll from their differences
const dgS={h:0,p:0,r:0};
function updateDinghy(dt){ const on=$('dinghy').checked; dinghy.mesh.visible=on; if (!on) return;
  dinghy.update(0,{}); const S=dinghy.state, c=Math.cos(S.head), s=Math.sin(S.head), at=(f,l)=>seaH(S.x+s*f+c*l,S.z+c*f-s*l);
  const hb=at(1.8,0), hs=at(-1.8,0), hp=at(0,0.65), hq=at(0,-0.65), k=dt>0?1-Math.exp(-dt*5):1;
  dgS.h+=((hb+hs+hp+hq)/4-dgS.h)*k; dgS.p+=((hs-hb)/3.6-dgS.p)*k; dgS.r+=((hp-hq)/1.3-dgS.r)*k;
  dinghy.mesh.position.y=dgS.h; dinghy.mesh.rotation.set(dgS.p,S.head,dgS.r,'YXZ'); }

/* ================= the whales in the testbench ================= */
const soundLog=[];
let time=0;
// a whale falling back after a breach sends a ring of waves across the sea: for a humpback, crests of about 1 m
// close by, some 13 m apart, dying away over half a minute
const W=createWhales(scene,{species:'humpback',count:2,diveSeconds:90,breaths:5,breachesPerHour:8,
  onSplash:(x,z,s,L,yaw)=>SEAS.addRing(x,z,0.077*L*s,0.9*L,30,yaw,0.42*L),onSound:(k,x,y,z,s)=>{ soundLog.push([k,+s.toFixed(2),+time.toFixed(1)]); if (soundLog.length>80) soundLog.shift(); }});
const ctx={camera,focus:{x:0,z:0},depthAt:()=>3000,seaLevel:0,seaAt:seaH,bright:1,paused:false,range:150};

/* ---------- controls ---------- */
const $=id=>document.getElementById(id);
let paused=false, follow=-1;
const bindRange=(id,fmt,set)=>{ const el=$(id), out=$(id+'V'); const f=()=>{ out.textContent=fmt(+el.value); set(+el.value); }; el.addEventListener('input',f); };
bindRange('count',v=>v,v=>{ W.setOptions({count:v}); if (follow>=v) setFollow(0); });
bindRange('dive',v=>v+' min',v=>W.setOptions({diveSeconds:v*60}));
bindRange('breaths',v=>v,v=>W.setOptions({breaths:v}));
bindRange('breach',v=>v+' /h',v=>W.setOptions({breachesPerHour:v}));
function setSpecies(k){ W.setOptions({species:k}); for (const s of ['blue','fin','humpback','sperm']) $('sp-'+s).setAttribute('aria-pressed',s===k); frameWhale(0); }
for (const s of ['blue','fin','humpback','sperm']) $('sp-'+s).onclick=()=>setSpecies(s);
function setTime(dusk){ hour=dusk?17.85:10.5; $('day').setAttribute('aria-pressed',!dusk); $('dusk').setAttribute('aria-pressed',dusk); updateDaylight(); }
$('day').onclick=()=>setTime(false); $('dusk').onclick=()=>setTime(true);
function setPause(p){ paused=p; $('pause').textContent=p?'Resume':'Pause'; $('pause').setAttribute('aria-pressed',p); }
$('pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{ if (e.code==='KeyP' && !e.repeat) setPause(!paused); });
// the whale the buttons act on: the one followed, or the one nearest the centre of the view
function chosen(){ if (follow>=0) return follow%Math.max(1,W.whales.length);
  let best=0, bd=1e9; W.whales.forEach((w,i)=>{ const d=Math.hypot(w.x-controls.target.x,w.z-controls.target.z); if (d<bd){ bd=d; best=i; } }); return best; }
$('surface').onclick=()=>W.trigger('surface',chosen());
$('breachNow').onclick=()=>W.trigger('breach',chosen());
const followPos=new THREE.Vector3(), followLook=new THREE.Vector3();
function setFollow(i){ follow=i; const on=i>=0; $('follow').textContent=on?'Orbit view':'Follow a whale'; $('follow').setAttribute('aria-pressed',on); $('next').hidden=!on; $('state').hidden=!on;
  controls.enabled=!on; if (!on){ controls.target.copy(followLook).setY(0); } else { const w=W.whales[i]; if (w){ followLook.set(w.x,Math.max(w.y,-1),w.z); followPos.copy(camera.position); } } }
$('follow').onclick=()=>setFollow(follow>=0?-1:0);
$('next').onclick=()=>setFollow((follow+1)%Math.max(1,W.whales.length));
function frameWhale(i){ W.update(0,ctx); const w=W.whales[i]; if (!w) return; const fx=Math.sin(w.yaw), fz=Math.cos(w.yaw);
  controls.target.set(w.x-fx*w.L*0.4,0,w.z-fz*w.L*0.4); camera.position.set(w.x+fz*w.L*3.2-fx*w.L*1.2,w.L*0.75,w.z-fx*w.L*3.2-fz*w.L*1.2); controls.update(); }

function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize(); setTime(false);

function tick(dt){
  const wdt=paused?0:dt; time+=wdt;
  ctx.bright=bright; ctx.paused=paused;
  W.update(dt,ctx); updateDinghy(wdt);
  SEAS.update(wdt,{centre:camera.position,camera,sunDir:SUN_DIR,sunColor:sun.color,skyTop:skyU.uTop.value,skyHorizon:skyU.uHor.value,bright,paused});
  if (follow>=0){ const i=follow%Math.max(1,W.whales.length), w=W.whales[i];
    if (w){ const c=W.point(i,0.45), fx=Math.sin(w.yaw), fz=Math.cos(w.yaw), rx=Math.cos(w.yaw), rz=-Math.sin(w.yaw);
      const want=new THREE.Vector3(c[0]-fx*w.L*1.6+rx*w.L*1.4,Math.max(w.L*0.45,3),c[2]-fz*w.L*1.6+rz*w.L*1.4), k=1-Math.exp(-dt*1.2);
      followPos.lerp(want,k); followLook.lerp(new THREE.Vector3(c[0],Math.max(c[1],-1),c[2]),1-Math.exp(-dt*3));
      camera.position.copy(followPos); camera.lookAt(followLook);
      const [a,b]=W.status(i); $('stName').textContent=a; $('stVal').textContent=b; } }
  else controls.update();
  const t=follow>=0?followLook:controls.target;
  sun.target.position.set(Math.round(t.x/2)*2,0,Math.round(t.z/2)*2); sun.position.copy(sun.target.position).addScaledVector(LIGHT_DIR,200);
  sky.position.copy(camera.position);
}
frameWhale(0);
let last=performance.now();
const tb={manual:false,W,camera,controls,soundLog,
  advance(sec,fps=60){ const n=Math.round(sec*fps); for (let i=0;i<n;i++) tick(1/fps); renderer.render(scene,camera); },
  view(px,py,pz,tx,ty,tz){ camera.position.set(px,py,pz); controls.target.set(tx,ty,tz); controls.update(); renderer.render(scene,camera); },
  setFollow, setTime, setPause, setSpecies, frameWhale, render(){ renderer.render(scene,camera); }};
window.tb=tb;
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (!tb.manual){ tick(dt); renderer.render(scene,camera); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
