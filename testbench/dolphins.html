<style>
/* The testbench uses the panel style of Coast: plaster text on a translucent sea-blue panel. */
:root{
  --sea:#1d5189; --sea-deep:#123761; --plaster:#f5e9d7; --plaster-dim:#d9c8b0;
  --coral:#d85d52; --verdigris:#7cc3ad; --ink:#26232b;
  --panel:rgba(18,55,97,.86); --line:rgba(245,233,215,.22);
  --font-display:'Marcellus','Trajan Pro',Georgia,serif;
  --font-body:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);color:var(--plaster);font-family:var(--font-body);font-size:16px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{position:fixed;z-index:4;top:16px;left:16px;width:min(300px,calc(100vw - 32px));box-sizing:border-box;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;backdrop-filter:blur(8px);font-size:.95rem;line-height:1.3}
.panel h1{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.panel .row{display:grid;grid-template-columns:7.2em 1fr 5.4em;align-items:center;gap:8px;padding:5px 0}
.panel .row.two{grid-template-columns:7.2em 1fr}
.panel label{color:var(--plaster-dim)}
.panel output{text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem}
.panel input[type=range]{width:100%;accent-color:var(--verdigris)}
.panel input[type=checkbox]{accent-color:var(--verdigris);width:18px;height:18px;margin:0}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;border-radius:0;border:0}
button{font:500 .9rem/1 var(--font-body);color:var(--plaster);background:rgba(245,233,215,.08);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--plaster);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions button{flex:1 1 40%}
[hidden]{display:none!important}
</style>

<canvas id="scene" tabindex="0" aria-label="Dolphins testbench"></canvas>
<aside class="panel" id="panel" aria-label="Dolphin settings">
  <h1>Dolphins</h1>
  <div class="row"><label for="pods">Pods</label><input id="pods" type="range" min="1" max="6" step="1" value="3"><output id="podsV">3</output></div>
  <div class="row"><label for="size">Pod size</label><input id="size" type="range" min="3" max="8" step="1" value="5"><output id="sizeV">5</output></div>
  <div class="row"><label for="leaps">Leaps</label><input id="leaps" type="range" min="0" max="12" step="1" value="3"><output id="leapsV">3 /min</output></div>
  <div class="row two"><label>Formation</label><div class="seg"><button id="tight" aria-pressed="true">Tight</button><button id="loose" aria-pressed="false">Loose</button></div></div>
  <div class="row two"><label for="bow">Bow-riding</label><input id="bow" type="checkbox" checked></div>
  <div class="row two"><label>Time of day</label><div class="seg"><button id="day" aria-pressed="true">Day</button><button id="dusk" aria-pressed="false">Dusk</button></div></div>
  <div class="actions">
    <button id="pause" aria-pressed="false">Pause</button>
    <button id="follow" aria-pressed="false">Follow a dolphin</button>
    <button id="next" hidden>Next dolphin</button>
  </div>
</aside>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const hex=h=>new THREE.Color(h);

/* ================= dolphins =================
   Pods of bottlenose dolphins for Coast. Everything below this line and above the matching closing line is
   self-contained and may be pasted into index.html as it stands; it needs only THREE.

   const D=createDolphins(parent, opts)   parent: the group the meshes join (in Coast, `world`)
     opts: pods (3), podSize (5, or [min, max] for a size drawn for each pod), leapsPerMinute (per pod, 3), bowRide (true), minDepth (m, 6),
           range (m from the focus within which pods keep, 260), formation ('tight' or 'loose'), maxDolphins (64), seed, ghost (0..1, 0.45),
           onSound(kind, x, y, z, strength), kind being 'breath', 'leap' or 'splash'
   D.update(dt, ctx)                      ctx: camera, focus {x,z} (defaults to the camera), range (m, overrides opts.range), seek (one of the boats,
                                           which the nearest pod makes for), boats
                                           [{x,z,head,v,len,beam}] (forward is (sin head, cos head)),
                                           depthAt(x,z) (depth of water in metres, negative on land), seaLevel (0), seaAt(x,z) (the swell's height there, optional),
                                           bright (0..1, the light on unlit foam and spray), paused,
                                           keepOut(x,z) (true where pods must not go), spawnWeight(x,z) (0..1, the
                                           chance that a pod may appear there)
   D.setOptions(o)   D.trigger(kind, pod)   ('breath', 'leap' or 'ride')   D.reset()   D.shift(dz)
   D.dolphins   D.pods   D.dispose()

   Positions are world metres with y up and the sea at y = seaLevel. Under water each dolphin is drawn a second
   time as a faint dark shape projected on to the surface (the swell's, where ctx.seaAt gives it) along the line of sight, so that it reads through the
   nearly opaque sea and is still hidden correctly by hulls and quays above the water. */
function createDolphins(parent, opts={}){
  const O=Object.assign({pods:3,podSize:5,leapsPerMinute:3,bowRide:true,minDepth:6,range:260,maxDolphins:64,seed:20261106,ghost:0.45,formation:'tight',onSound:null},opts);
  let sd=(O.seed>>>0)||1;
  const R=()=>{ sd=(sd+0x6D2B79F5)>>>0; let t=sd; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
  const rr=(a,b)=>a+(b-a)*R();
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  const angTo=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));
  const G=9.81, TAU=Math.PI*2;
  let SEA=0, seaAt=null;   // the mean sea level, and the swell's height above it where ctx.seaAt gives one
  const seaY=(x,z)=>SEA+(seaAt?seaAt(x,z):0);

  /* ---------- the body: rings of eight round a tapering axis, with dorsal fin, flippers and flukes ----------
     The dolphin is 2.6 m long, its nose towards +z and its back towards +y; the flukes reach 1.47 m behind the
     centre. The colour grades from a dark grey cape through paler flanks to a near-white belly. */
  function buildGeo(){
    const P=[], C=[];
    const cBack=hex('#525f6b'), cFlank=hex('#8794a0'), cBelly=hex('#dcdcd6'), cFin=hex('#48545f'), cEye=hex('#16191d');
    const tri=(a,b,c,dir,ca,cb,cc)=>{
      const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
      const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      if (nx*dir[0]+ny*dir[1]+nz*dir[2]<0){ const t=b; b=c; c=t; const q=cb; cb=cc; cc=q; }
      P.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]); C.push(ca.r,ca.g,ca.b,cb.r,cb.g,cb.b,cc.r,cc.g,cc.b); };
    // z, half width, half height, height of the axis
    const ST=[[-1.18,0.022,0.05,0.0],[-1.0,0.042,0.095,0.005],[-0.75,0.085,0.155,0.012],[-0.45,0.15,0.225,0.02],[-0.15,0.205,0.27,0.025],
      [0.15,0.232,0.285,0.02],[0.45,0.212,0.25,0.018],[0.70,0.165,0.195,0.02],[0.86,0.118,0.135,0.0],[0.95,0.066,0.062,-0.045],
      [1.12,0.046,0.042,-0.06],[1.27,0.022,0.02,-0.066]];
    const colAt=(s,z)=>{ const c=cBelly.clone().lerp(cFlank,smooth((s+0.75)/0.6)); c.lerp(cBack,smooth((s-0.05)/0.6));
      if (z>0.9 && s<0) c.lerp(cBelly,0.4); return c; };
    const N=8, rings=ST.map(([z,rx,ry,yc])=>{ const ring=[]; for (let k=0;k<N;k++){ const a=Math.PI/2+k*TAU/N, s=Math.sin(a);
      ring.push({p:[rx*Math.cos(a),yc+ry*s,z],c:colAt(s,z)}); } return {ring,yc,z}; });
    for (let i=0;i<rings.length-1;i++){ const A=rings[i], B=rings[i+1];
      for (let k=0;k<N;k++){ const j=(k+1)%N, a=A.ring[k], b=A.ring[j], c=B.ring[j], d=B.ring[k];
        const m=[(a.p[0]+c.p[0])/2,(a.p[1]+c.p[1])/2-(A.yc+B.yc)/2,0];
        tri(a.p,d.p,c.p,m,a.c,d.c,c.c); tri(a.p,c.p,b.p,m,a.c,c.c,b.c); } }
    { const A=rings[0], T=[0,0,-1.22]; for (let k=0;k<N;k++){ const a=A.ring[k], b=A.ring[(k+1)%N]; tri(a.p,b.p,T,[a.p[0]+b.p[0],a.p[1]+b.p[1],-0.2],a.c,b.c,cFlank); } }
    { const A=rings[rings.length-1], T=[0,-0.066,1.32]; for (let k=0;k<N;k++){ const a=A.ring[k], b=A.ring[(k+1)%N]; tri(a.p,b.p,T,[a.p[0]+b.p[0],a.p[1]+b.p[1]+0.13,0.2],a.c,b.c,cFlank); } }
    // a thin plate from an outline, its thickness th at each point measured along nrm
    const plate=(pts,th,nrm,col)=>{ const n=pts.length;
      const top=pts.map((p,i)=>[p[0]+nrm[0]*th[i]/2,p[1]+nrm[1]*th[i]/2,p[2]+nrm[2]*th[i]/2]);
      const bot=pts.map((p,i)=>[p[0]-nrm[0]*th[i]/2,p[1]-nrm[1]*th[i]/2,p[2]-nrm[2]*th[i]/2]);
      const cen=[0,0,0]; for (const p of pts){ cen[0]+=p[0]/n; cen[1]+=p[1]/n; cen[2]+=p[2]/n; }
      const neg=[-nrm[0],-nrm[1],-nrm[2]];
      for (let i=1;i<n-1;i++){ tri(top[0],top[i],top[i+1],nrm,col,col,col); tri(bot[0],bot[i],bot[i+1],neg,col,col,col); }
      for (let i=0;i<n;i++){ const j=(i+1)%n, m=[(pts[i][0]+pts[j][0])/2-cen[0],(pts[i][1]+pts[j][1])/2-cen[1],(pts[i][2]+pts[j][2])/2-cen[2]];
        tri(top[i],bot[i],bot[j],m,col,col,col); tri(top[i],bot[j],top[j],m,col,col,col); } };
    // dorsal fin: falcate, its tip swept back over the hollow of its trailing edge
    plate([[0,0.27,0.14],[0,0.40,-0.01],[0,0.50,-0.19],[0,0.575,-0.42],[0,0.47,-0.36],[0,0.36,-0.33],[0,0.235,-0.37]],
      [0.065,0.05,0.032,0,0.02,0.035,0.05],[1,0,0],cFin);
    // flippers, angled down and back from the lower flank
    for (const sx of [-1,1]){ const n=new THREE.Vector3(sx*0.5,0.86,0.1).normalize();
      plate([[sx*0.15,-0.11,0.52],[sx*0.29,-0.19,0.41],[sx*0.43,-0.31,0.2],[sx*0.37,-0.28,0.19],[sx*0.17,-0.16,0.31]],[0.05,0.035,0,0.012,0.04],[n.x,n.y,n.z],cFin); }
    // flukes, swept back with a notch at the middle of the trailing edge
    plate([[0,0,-1.05],[0.17,0,-1.21],[0.37,0,-1.44],[0.31,0,-1.48],[0.15,0,-1.41],[0,0,-1.35],[-0.15,0,-1.41],[-0.31,0,-1.48],[-0.37,0,-1.44],[-0.17,0,-1.21]],
      [0.07,0.045,0,0,0.02,0.03,0.02,0,0,0.045],[0,1,0],cFin);
    // eyes
    for (const sx of [-1,1]){ const x=sx*0.15; tri([x,0.03,0.80],[x,-0.012,0.83],[x,-0.006,0.765],[sx,0,0],cEye,cEye,cEye); }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
    g.computeVertexNormals(); return g;
  }

  /* ---------- the flex: a wave runs back along the body, growing towards the flukes, which pitch with its slope;
     aFlex = (phase, amplitude at the flukes in metres, curvature of the path in 1/m) ---------- */
  const FLEX=`vec3 transformed = vec3( position );
    { float zz=transformed.z, zn=zz/1.3;
      float w=clamp((0.25-zn)/1.3,0.0,1.0), w2=w*w, dw=(w>0.0&&w<1.0)?-2.0*w/1.69:0.0;
      float ph=aFlex.x+2.4*zn, s=sin(ph), c=cos(ph);
      float dy=aFlex.y*w2*s+0.5*aFlex.z*zz*zz;
      float sl=aFlex.y*(dw*s+w2*c*2.4/1.3)+aFlex.z*zz;
      float a=atan(sl), yl=transformed.y;
      transformed.y=dy+yl*cos(a); transformed.z=zz-yl*sin(a); }`;
  const patchFlex=sh=>{ sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nattribute vec3 aFlex;').replace('#include <begin_vertex>',FLEX); };

  const geo=buildGeo(), MAXD=O.maxDolphins;
  const flexA=new THREE.InstancedBufferAttribute(new Float32Array(MAXD*3),3); flexA.setUsage(THREE.DynamicDrawUsage); geo.setAttribute('aFlex',flexA);
  // the height of the swell over each dolphin (ctx.seaAt), on which its shape under water is drawn
  const seaA=new THREE.InstancedBufferAttribute(new Float32Array(MAXD),1); seaA.setUsage(THREE.DynamicDrawUsage); geo.setAttribute('aSea',seaA);
  const bodyMat=new THREE.MeshPhongMaterial({vertexColors:true,flatShading:true,shininess:36,specular:hex('#2f353b')});
  bodyMat.onBeforeCompile=patchFlex; bodyMat.customProgramCacheKey=()=>'dolphin-body';
  const depthMat=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking}); depthMat.onBeforeCompile=patchFlex; depthMat.customProgramCacheKey=()=>'dolphin-depth';
  const body=new THREE.InstancedMesh(geo,bodyMat,MAXD); body.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  body.castShadow=true; body.customDepthMaterial=depthMat; body.frustumCulled=false; body.count=0;
  for (let i=0;i<MAXD;i++) body.setColorAt(i,new THREE.Color(1,1,1));
  // the shape under water, drawn after the sea at the depth of the surface
  const ghostU={uSeaY:{value:0}};
  const ghostCol=hex('#183650'), ghostMat=new THREE.MeshBasicMaterial({color:ghostCol.clone(),transparent:true,opacity:O.ghost,depthWrite:false,
    polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-4});
  ghostMat.onBeforeCompile=sh=>{ patchFlex(sh); sh.uniforms.uSeaY=ghostU.uSeaY;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying float vDepth; uniform float uSeaY; attribute float aSea;')
      .replace('#include <project_vertex>',`vec4 wp=vec4(transformed,1.0);
        #ifdef USE_INSTANCING
          wp=instanceMatrix*wp;
        #endif
        float sy=uSeaY+aSea; wp=modelMatrix*wp; vDepth=sy-wp.y;
        vec3 sp=wp.xyz; if (wp.y<sy && cameraPosition.y>sy){ sp=cameraPosition+(wp.xyz-cameraPosition)*((cameraPosition.y-sy)/(cameraPosition.y-wp.y)); }
        vec4 mvPosition=viewMatrix*vec4(sp,1.0); gl_Position=projectionMatrix*mvPosition;`);
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>','#include <common>\nvarying float vDepth;')
      .replace('vec4 diffuseColor = vec4( diffuse, opacity );','if (vDepth<0.0) discard; vec4 diffuseColor=vec4(diffuse,opacity*exp(-vDepth/2.0)*smoothstep(0.0,0.25,vDepth));'); };
  ghostMat.customProgramCacheKey=()=>'dolphin-ghost';
  const ghost=new THREE.InstancedMesh(geo,ghostMat,MAXD); ghost.instanceMatrix=body.instanceMatrix; ghost.frustumCulled=false; ghost.count=0; ghost.renderOrder=2;

  /* ---------- foam rings where the water is broken ---------- */
  const MAXR=240, foamCol=hex('#f4f1e8');
  const ringGeo=new THREE.CircleGeometry(1,20).rotateX(-Math.PI/2);
  const ringA=new THREE.InstancedBufferAttribute(new Float32Array(MAXR*3),3); ringA.setUsage(THREE.DynamicDrawUsage); ringGeo.setAttribute('aRing',ringA);
  const fxU=THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{uCol:{value:foamCol.clone()},uBright:{value:1},uScale:{value:800}}]);
  const ringMat=new THREE.ShaderMaterial({uniforms:fxU,transparent:true,depthWrite:false,fog:true,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-6,
    vertexShader:`attribute vec3 aRing; varying vec3 vR; varying vec2 vP;
      #include <fog_pars_vertex>
      void main(){ vP=position.xz; vR=aRing; vec4 mvPosition=modelViewMatrix*instanceMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`uniform vec3 uCol; uniform float uBright; varying vec3 vR; varying vec2 vP;
      #include <common>
      #include <fog_pars_fragment>
      float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        return mix(mix(h2(i),h2(i+vec2(1.0,0.0)),f.x),mix(h2(i+vec2(0.0,1.0)),h2(i+vec2(1.0,1.0)),f.x),f.y); }
      void main(){
        float r=length(vP); if (r>1.0) discard;
        float age=vR.x, pt=step(1.5,vR.y), n=n2(vP*4.0+vR.y*31.0)*0.6+n2(vP*9.0-vR.y*17.0)*0.4, m=n2(vP*13.0+vR.y*7.0);
        // an outlined ring for a break of the surface, or a soft patch of foam with no outline
        float ring=(1.0-pt)*(1.0-smoothstep(0.0,0.07+0.22*age,abs(r-0.82)))*(0.55+0.45*m);
        float core=(1.0-smoothstep(0.1,0.85,r))*mix(1.0-smoothstep(0.0,0.5,age),1.0,pt);
        float f=smoothstep(0.3,0.62,max(ring*0.85,core*0.95)*(0.35+0.95*n));
        float a=f*vR.z*(1.0-age)*(1.0-0.4*age); if (a<0.01) discard;
        gl_FragColor=vec4(uCol*uBright,a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`});
  const rings=new THREE.InstancedMesh(ringGeo,ringMat,MAXR); rings.instanceMatrix.setUsage(THREE.DynamicDrawUsage); rings.frustumCulled=false; rings.count=0; rings.renderOrder=3;
  const RG=[];   // live rings: {x,z,r0,r1,age,life,str,seed}

  /* ---------- spray: drops thrown up by a splash, and the mist of a breath ---------- */
  const MAXP=1200, pPos=new Float32Array(MAXP*3), pSize=new Float32Array(MAXP), pAlpha=new Float32Array(MAXP);
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3).setUsage(THREE.DynamicDrawUsage));
  pGeo.setAttribute('aSize',new THREE.BufferAttribute(pSize,1).setUsage(THREE.DynamicDrawUsage));
  pGeo.setAttribute('aAlpha',new THREE.BufferAttribute(pAlpha,1).setUsage(THREE.DynamicDrawUsage));
  const sprayMat=new THREE.ShaderMaterial({uniforms:fxU,transparent:true,depthWrite:false,fog:true,
    vertexShader:`attribute float aSize; attribute float aAlpha; uniform float uScale; varying float vA;
      #include <fog_pars_vertex>
      void main(){ vA=aAlpha; vec4 mvPosition=modelViewMatrix*vec4(position,1.0); gl_PointSize=max(1.5,aSize*uScale/max(0.2,-mvPosition.z)); gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`uniform vec3 uCol; uniform float uBright; varying float vA;
      #include <common>
      #include <fog_pars_fragment>
      void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c); if (d>0.5) discard;
        gl_FragColor=vec4(uCol*uBright,vA*(1.0-smoothstep(0.32,0.5,d)));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`});
  const spray=new THREE.Points(pGeo,sprayMat); spray.frustumCulled=false; spray.renderOrder=4;
  const _sz=new THREE.Vector2();
  spray.onBeforeRender=(renderer,scene,camera)=>{ renderer.getDrawingBufferSize(_sz); fxU.uScale.value=_sz.y/(2*Math.tan(THREE.MathUtils.degToRad((camera.fov||50)/2))); };
  const PT=[];   // live particles: {x,y,z,vx,vy,vz,age,life,size,a,mist}
  pGeo.setDrawRange(0,0);
  parent.add(body,ghost,rings,spray);

  const sound=(k,x,y,z,s)=>{ if (O.onSound) try { O.onSound(k,x,y,z,s); } catch(e){} };
  function ring(x,z,r0,r1,life,str){ if (RG.length>=MAXR) RG.shift(); RG.push({x,z,r0,r1,age:0,life,str,seed:R()}); }
  function patch(x,z,r0,r1,life,str){ if (RG.length>=MAXR) RG.shift(); RG.push({x,z,r0,r1,age:0,life,str,seed:2+R()}); }
  function drops(x,y,z,n,up,out,dirx,dirz,carry){ for (let i=0;i<n;i++){ if (PT.length>=MAXP) PT.shift();
    const a=R()*TAU, o=out*(0.3+0.7*R());

const $=id=>document.getElementById(id);
let paused=false, follow=-1;
const bindRange=(id,fmt,set)=>{ const el=$(id), out=$(id+'V'); const f=()=>{ out.textContent=fmt(+el.value); set(+el.value); }; el.addEventListener('input',f); };
bindRange('pods',v=>v,v=>D.setOptions({pods:v}));
bindRange('size',v=>v,v=>D.setOptions({podSize:v}));
bindRange('leaps',v=>v+' /min',v=>D.setOptions({leapsPerMinute:v}));
$('bow').addEventListener('change',e=>D.setOptions({bowRide:e.target.checked}));
function setTime(dusk){ hour=dusk?17.85:10.5; $('day').setAttribute('aria-pressed',!dusk); $('dusk').setAttribute('aria-pressed',dusk); updateDaylight(); }
function setFormation(f){ D.setOptions({formation:f}); $('tight').setAttribute('aria-pressed',f==='tight'); $('loose').setAttribute('aria-pressed',f==='loose'); }
$('tight').onclick=()=>setFormation('tight'); $('loose').onclick=()=>setFormation('loose');
$('day').onclick=()=>setTime(false); $('dusk').onclick=()=>setTime(true);
function setPause(p){ paused=p; $('pause').textContent=p?'Resume':'Pause'; $('pause').setAttribute('aria-pressed',p); }
$('pause').onclick=()=>setPause(!paused);
addEventListener('keydown',e=>{ if (e.code==='KeyP' && !e.repeat) setPause(!paused); });
const followPos=new THREE.Vector3(), followLook=new THREE.Vector3();
function setFollow(i){ follow=i; const on=i>=0; $('follow').textContent=on?'Orbit view':'Follow a dolphin'; $('follow').setAttribute('aria-pressed',on); $('next').hidden=!on;
  controls.enabled=!on; if (!on){ controls.target.copy(followLook).setY(0); } else { const d=D.dolphins[i]; if (d){ followLook.set(d.x,d.y,d.z); followPos.copy(camera.position); } } }
$('follow').onclick=()=>setFollow(follow>=0?-1:0);
$('next').onclick=()=>setFollow((follow+1)%Math.max(1,D.dolphins.length));

function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize(); setTime(false);

function tick(dt){
  const wdt=paused?0:dt; time+=wdt; seaUniforms.uTime.value=time;
  updateFerry(wdt);
  ctx.bright=bright; ctx.paused=paused;
  D.update(dt,ctx);
  if (follow>=0){ const d=D.dolphins[follow%Math.max(1,D.dolphins.length)];
    if (d){ const fx=Math.sin(d.head), fz=Math.cos(d.head), rx=Math.cos(d.head), rz=-Math.sin(d.head);
      const want=new THREE.Vector3(d.x-fx*6.5+rx*3.2,Math.max(d.y+2.2,1.4),d.z-fz*6.5+rz*3.2), k=1-Math.exp(-dt*3);
      followPos.lerp(want,k); followLook.lerp(new THREE.Vector3(d.x+fx*1.5,Math.max(d.y,-0.6),d.z+fz*1.5),1-Math.exp(-dt*6));
      camera.position.copy(followPos); camera.lookAt(followLook); } }
  else controls.update();
  const t=follow>=0?followLook:controls.target;
  sun.target.position.set(Math.round(t.x/2)*2,0,Math.round(t.z/2)*2); sun.position.copy(sun.target.position).addScaledVector(LIGHT_DIR,200);
  sky.position.copy(camera.position);
}
let last=performance.now();
const tb={manual:false,D,ferry:ferryInfo,camera,controls,soundLog,
  advance(sec,fps=60){ const n=Math.round(sec*fps); for (let i=0;i<n;i++) tick(1/fps); renderer.render(scene,camera); },
  view(px,py,pz,tx,ty,tz){ camera.position.set(px,py,pz); controls.target.set(tx,ty,tz); controls.update(); renderer.render(scene,camera); },
  setFollow, setTime, setPause, render(){ renderer.render(scene,camera); }};
window.tb=tb;
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (!tb.manual){ tick(dt); renderer.render(scene,camera); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
