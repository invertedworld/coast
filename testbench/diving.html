<!doctype html>
<title>Coast: diving</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* The testbench uses the panel style of Coast: plaster text on a translucent sea-blue panel. */
:root{
  --sea:#1d5189; --sea-deep:#123761; --plaster:#f5e9d7; --plaster-dim:#d9c8b0;
  --coral:#d85d52; --verdigris:#7cc3ad; --ink:#26232b;
  --panel:rgba(18,55,97,.86); --line:rgba(245,233,215,.22);
  --font-display:'Marcellus','Trajan Pro',Georgia,serif;
  --font-body:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);color:var(--plaster);font-family:var(--font-body);font-size:16px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{position:fixed;z-index:4;top:16px;left:16px;width:min(300px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;backdrop-filter:blur(8px);font-size:.95rem;line-height:1.3}
.panel h1{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.panel h2{margin:12px 0 4px;font-family:var(--font-display);font-weight:400;font-size:1.02rem;color:var(--plaster-dim)}
.panel .row{display:grid;grid-template-columns:6.6em 1fr 4.4em;align-items:center;gap:8px;padding:5px 0}
.panel .row.two{grid-template-columns:6.6em 1fr}
.panel label{color:var(--plaster-dim)}
.panel output{text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem}
.panel input[type=range]{width:100%;accent-color:var(--verdigris)}
.panel input[type=checkbox]{accent-color:var(--verdigris);width:18px;height:18px;margin:0}
.panel select{font:500 .9rem/1 var(--font-body);color:var(--plaster);background:rgba(245,233,215,.08);border:1px solid var(--line);border-radius:3px;padding:6px 6px}
.panel select option{color:var(--ink)}
button{font:500 .9rem/1 var(--font-body);color:var(--plaster);background:rgba(245,233,215,.08);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--plaster);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.presets button{flex:1 1 45%}
.dbg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem}
.dbg span:nth-child(odd){color:var(--plaster-dim)}
.dbg span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
</style>

<canvas id="scene" tabindex="0" aria-label="Diving testbench"></canvas>
<aside class="panel" id="panel" aria-label="Diving settings">
  <h1>Diving</h1>
  <div class="row"><label for="hr">Time of day</label><input id="hr" type="range" min="5" max="21" step="0.25" value="11"><output id="hrV">11:00</output></div>
  <h2>Wind and waves</h2>
  <div class="actions presets">
    <button data-p="calm">Calm</button><button data-p="light" aria-pressed="true">Light breeze</button>
    <button data-p="moderate">Moderate breeze</button><button data-p="fresh">Fresh breeze</button>
    <button data-p="swell">Swell only</button>
  </div>
  <h2>Water</h2>
  <div class="row"><label for="cl">Clarity</label><input id="cl" type="range" min="8" max="40" step="1" value="28"><output id="clV">28 m</output></div>
  <div class="row"><label for="ls">Light shafts</label><input id="ls" type="range" min="0" max="3" step="0.05" value="1"><output id="lsV">1.00</output></div>
  <div class="row two"><label for="br">Breath</label><input id="br" type="checkbox" checked></div>
  <div class="row two"><label for="tp">Teleport</label><select id="tp">
    <option value="beach">Beach</option><option value="quay">Quay</option><option value="reef">Reef, 8 m</option>
    <option value="grass">Seagrass, 12 m</option><option value="sand">Sand, 20 m</option><option value="wreck">Wreck</option></select></div>
  <div class="actions"><button id="pause" aria-pressed="false">Pause</button></div>
  <h2>Readings</h2>
  <div class="dbg">
    <span>Depth</span><span id="dDepth">–</span>
    <span>Frame time</span><span id="dFrame">–</span>
    <span>Draw calls</span><span id="dCalls">–</span>
  </div>
</aside>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const hex=h=>new THREE.Color(h);

/* ================= sea =================
   A wind sea and a swell for Coast, as sculpted geometry. Everything below this line and above the matching closing
   line is self-contained and needs only THREE.

   const S=createSea(parent, opts)
     opts: radius (m, 3000), rings (400), segs (360): the disc of the mesh, dense round its middle;
           steep (0..1.5, 1): how peaked the crests are; whitecaps (true); seed;
           field: {x0, z0, cell, n, fn(x,z) -> [swellFactor, windFactor, depth]}: the shore, sampled into a texture
           (outside it the sea is open and deep); gust: a createWind instance, whose gust patches roughen and darken
           the water (optional)
   S.update(dt, ctx)       ctx: centre {x,z} (where the mesh is densest: the camera), camera, sunDir, sunColor,
                           skyTop, skyHorizon (THREE.Color), bright (0..1), paused
   S.setWind(speed, dirFrom, instant)   the wind that raises the sea; it builds and eases over about 12 s
                                         unless instant. dirFrom is a heading in Coast's convention: the wind comes
                                         from (sin d, cos d)
   S.setSwell(height, dirFrom)          trough-to-crest height of the swell at the meeting of a set, and where it
                                         comes from
   S.setOptions({steep, whitecaps, clarity})   clarity: how far one sees into the water, in metres (12)
   S.rebuildField()   S.setWireframe(on)
   For depth the host draws the scene without the sea (S.mesh hidden) into a render target with a depth texture,
   and passes it as ctx.behind {texture, depthTexture, width, height} with ctx.camera: the water then shows what
   lies beneath it through the length of water the light crosses, the red absorbed first, with the light the waves
   focus on the sea bed; without it the water is drawn opaque.
   S.sample(x,z,out) -> out {h, nx, ny, nz}   the height of the surface over (x,z) and its normal, exactly as drawn
   S.heightAt(x,z)   S.normalAt(x,z,out)       S.info() -> {hs, lp, tp, u}
   S.glsl, S.uniforms: the surface in GLSL (seaSurf(p0) -> displacement and normal), for other materials that ride it
   S.mesh   S.dispose()

   The surface is a sum of Gerstner (trochoidal) waves: each point moves round a circle, so that the crests come
   to a point and the troughs are broad. The wind sea has twelve components with wavelengths from 3 to 60 m spread
   about the wind's direction by up to 36 degrees; their heights follow a spectrum peaked at a wavelength that grows
   with the wind (about 0.45 U^2 m), and the height of the sea grows with the square of the wind (about 0.018 U^2,
   so 0.65 m at 6 m/s and 1.5 m at 9 m/s). A change of wind direction brings up a second set of components at the
   new direction while the first dies away, so the waves never swing across the whole sea at once. The swell is
   three long components. Each component is drawn only where the mesh is fine enough to carry it (four or more
   vertices to a wavelength), so the distant sea keeps its long waves and does not shimmer. Near the shore the
   waves grow and steepen as the water shoals, and break into surf; behind the mole and in the lee of the land
   they are smaller. */
function createSea(parent, opts={}){
  const O=Object.assign({radius:3000,rings:520,segs:480,steep:1,whitecaps:true,seed:7,field:null,gust:null,outside:[1,1,20],wrapZ:0,ease:12,clarity:12},opts);
  const G=9.81, TAU=Math.PI*2, NW=12, NS=3, NT=NW*2+NS;
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v)), sm=(a,b,x)=>{ const t=cl((x-a)/(b-a),0,1); return t*t*(3-2*t); };
  let sd=(O.seed>>>0)||1; const R=()=>{ sd=(sd+0x6D2B79F5)>>>0; let t=sd; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };

  /* ---------- the components ---------- */
  const LAM=[...Array(NW)].map((_,i)=>3*Math.pow(20,i/(NW-1)));          // 3 to 60 m
  const OFF=[0.05,-0.32,0.38,-0.12,0.22,-0.48,0.6,-0.2,0.12,-0.62,0.45,-0.05];   // about the wind, radians
  const sets=[0,1].map(()=>({dir:0,w:0,ph:LAM.map(()=>R()*TAU)}));
  sets[0].w=1;
  const swPh=[R()*TAU,R()*TAU,R()*TAU];
  const W=new Float32Array(NT*4), PH=new Float32Array(NT);              // per component: kx, kz, amplitude, Q; phase
  const U={uW:{value:[...Array(NT)].map(()=>new THREE.Vector4())},uPh:{value:new Array(NT).fill(0)},uN:{value:NT},
    uCentre:{value:new THREE.Vector2()},uSpc:{value:1},uField:{value:null},uFieldR:{value:new THREE.Vector4(0,0,1,1)},
    uSunDir:{value:new THREE.Vector3(0,1,0)},uSunCol:{value:new THREE.Color(1,1,1)},uSkyTop:{value:new THREE.Color()},uSkyHor:{value:new THREE.Color()},
    uDeep:{value:new THREE.Color('#0a3a64')},uMid:{value:new THREE.Color('#2c79b4')},uThin:{value:new THREE.Color('#3fb3a8')},uShallow:{value:new THREE.Color('#5cc4c0')},
    uFoam:{value:new THREE.Color('#f4f1e8')},uTime:{value:0},uWind:{value:0},uWindDir:{value:new THREE.Vector2(0,1)},uWhite:{value:1},uBright:{value:1},uSwellA:{value:0.3},
    uGustTex:{value:null},uGust:{value:new THREE.Vector4(0,1,0,36)},uGustAmt:{value:0},
    uOff:{value:new THREE.Vector3()},uGustC:{value:0},uScale:{value:1},uOutside:{value:new THREE.Vector3(...O.outside)},
    uScene:{value:null},uSceneDepth:{value:null},uRes:{value:new THREE.Vector2(1,1)},uProjInv:{value:new THREE.Matrix4()},uCamWorld:{value:new THREE.Matrix4()},uClarity:{value:12},uHasScene:{value:0},uPassFar:{value:1e6},uDetail:{value:1}};
  const st={U:5,Ut:5,dirT:0,swellH:0.6,swellDir:0,swLens:[82,108,64],time:0,hs:0,lp:0,tp:0,Q:1,cx:0,cz:0,scale:1,qx:0,qz:0,detail:1};

  /* ---------- the shore field: [swell factor, wind factor, depth] in a texture, read alike by GPU and CPU ---------- */
  let F=null;
  // the shore field as bytes: per cell [swell factor, wind factor] over 1.5 and the depth over 20 m, then 255
  function setFieldData(data,n,x0,z0,cell){
    if (!F || F.n!==n || F.data!==data){ if (F) F.tex.dispose(); const tex=new THREE.DataTexture(data,n,n,THREE.RGBAFormat); tex.magFilter=tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false; F={n,data,tex}; }
    F.x0=x0; F.z0=z0; F.cell=cell; F.tex.needsUpdate=true; U.uField.value=F.tex; }
  function moveField(dx,dz){ if (F){ F.x0+=dx; F.z0+=dz; } }
  function rebuildField(){
    const f=O.field; if (!f) return;
    const n=f.n, data=F&&F.n===n?F.data:new Uint8Array(n*n*4);
    for (let j=0;j<n;j++) for (let i=0;i<n;i++){ const [a,b,d]=f.fn(f.x0+i*f.cell,f.z0+j*f.cell), k=(j*n+i)*4;
      data[k]=Math.round(cl(a/1.5,0,1)*255); data[k+1]=Math.round(cl(b/1.5,0,1)*255); data[k+2]=Math.round(cl(d/20,0,1)*255); data[k+3]=255; }
    setFieldData(data,n,f.x0,f.z0,f.cell);
  }
  const _f=[1,1,20];
  function fieldAt(x,z){
    const OU=O.outside;
    if (!F){ _f[0]=OU[0]; _f[1]=OU[1]; _f[2]=OU[2]; return _f; }
    const fx=(x-F.x0)/F.cell, fz=(z-F.z0)/F.cell, n=F.n;
    if (fx<0||fz<0||fx>n-1||fz>n-1){ _f[0]=OU[0]; _f[1]=OU[1]; _f[2]=OU[2]; return _f; }
    const i0=Math.min(n-2,Math.floor(fx)), j0=Math.min(n-2,Math.floor(fz)), tx=fx-i0, tz=fz-j0, D=F.data;
    for (let c=0;c<3;c++){ const a=D[(j0*n+i0)*4+c], b=D[(j0*n+i0+1)*4+c], e=D[((j0+1)*n+i0)*4+c], g=D[((j0+1)*n+i0+1)*4+c];
      _f[c]=((a*(1-tx)+b*tx)*(1-tz)+(e*(1-tx)+g*tx)*tz)/255*(c===2?20:1.5); }
    return _f; }

  /* ---------- the surface, in GLSL and in JavaScript alike ---------- */
  const GLSL=`
    uniform vec4 uW[${NT}]; uniform float uPh[${NT}]; uniform int uN; uniform vec2 uCentre; uniform float uSpc, uScale;
    uniform sampler2D uField; uniform vec4 uFieldR; uniform vec3 uOff, uOutside;
    // positions here are the world's less a fixed offset (uOff carries the rest), so that phases stay precise
    vec3 seaField(vec2 p){ vec2 f=(p-uFieldR.xy)/uFieldR.z; if (f.x<0.0||f.y<0.0||f.x>uFieldR.w-1.0||f.y>uFieldR.w-1.0) return uOutside;
      vec3 v=texture2D(uField,(f+0.5)/uFieldR.w).rgb; return vec3(v.x*1.5,v.y*1.5,v.z*20.0); }
    // the displacement of the point that rests at p0, with the normal and how far the surface is folded (1 flat, 0 a sharp crest)
    void seaSurf(vec2 p0, out vec3 disp, out vec3 nrm, out float fold, out float swl){
      vec3 fa=seaField(p0); float r=length(p0-uCentre), spc=uSpc*uScale*pow(max(r/uScale,1.0),0.6667);
      float qb=1.0+0.7*(1.0-smoothstep(1.2,4.5,fa.z));          // the crests steepen as the water shoals
      float T=0.0;
      for (int i=0;i<${NT};i++){ if (i>=uN) break; vec4 w=uW[i]; float k=length(w.xy); if (k<1e-5) continue;
        float lam=6.2832/k, A=w.z*smoothstep(4.0,6.0,lam/spc)*(i<${NS}?fa.x:fa.y); T+=w.w*qb*smoothstep(5.0,9.0,lam/spc)*k*A; }
      float qs=T>0.92?0.92/T:1.0;
      disp=vec3(0.0); vec3 n=vec3(0.0,1.0,0.0); swl=0.0;
      for (int i=0;i<${NT};i++){ if (i>=uN) break; vec4 w=uW[i]; float k=length(w.xy); if (k<1e-5) continue;
        // a crest is drawn sharp only where the mesh is fine enough for it, so that distant crests keep a smooth edge
        float lam=6.2832/k, A=w.z*smoothstep(4.0,6.0,lam/spc)*(i<${NS}?fa.x:fa.y), Q=w.w*qb*qs*smoothstep(5.0,9.0,lam/spc); vec2 D=w.xy/k;
        float ph=dot(w.xy,p0)+uPh[i], C=cos(ph), S=sin(ph);
        disp.xz+=Q*A*D*C; disp.y+=A*S; if (i<${NS}) swl+=A*S;
        n.xz-=D*k*A*C; n.y-=Q*k*A*S; }
      fold=n.y; nrm=normalize(n); }`;
  const _d={x:0,y:0,z:0,nx:0,ny:1,nz:0,fold:1};
  function surfJS(px,pz,out=_d){
    const fa=fieldAt(px,pz), fs=fa[0], fw=fa[1], dep=fa[2], r=Math.hypot(px-st.cx,pz-st.cz), spc=U.uSpc.value*st.scale*Math.pow(Math.max(r/st.scale,1),0.6667);
    const qb=1+0.7*(1-sm(1.2,4.5,dep)); let T=0;
    for (let i=0;i<NT;i++){ const k=Math.hypot(W[i*4],W[i*4+1]); if (k<1e-5) continue; const lam=TAU/k; T+=W[i*4+3]*qb*sm(5,9,lam/spc)*k*W[i*4+2]*sm(4,6,lam/spc)*(i<NS?fs:fw); }
    const qs=T>0.92?0.92/T:1;
    let dx=0, dy=0, dz=0, nx=0, ny=1, nz=0;
    for (let i=0;i<NT;i++){ const kx=W[i*4], kz=W[i*4+1], k=Math.hypot(kx,kz); if (k<1e-5) continue;
      const lam=TAU/k, A=W[i*4+2]*sm(4,6,lam/spc)*(i<NS?fs:fw), Q=W[i*4+3]*qb*qs*sm(5,9,lam/spc), Dx=kx/k, Dz=kz/k, ph=kx*px+kz*pz+PH[i], C=Math.cos(ph), S=Math.sin(ph);
      dx+=Q*A*Dx*C; dz+=Q*A*Dz*C; dy+=A*S; nx-=Dx*k*A*C; nz-=Dz*k*A*C; ny-=Q*k*A*S; }
    out.x=dx; out.y=dy; out.z=dz; out.fold=ny; const l=Math.hypot(nx,ny,nz); out.nx=nx/l; out.ny=ny/l; out.nz=nz/l; return out; }
  // the surface over (x,z): the resting point whose displaced position lies there, found in a few steps
  function sample(x,z,out={h:0,nx:0,ny:1,nz:0},iter=4){
    let px=x, pz=z;
    for (let it=0;it<iter;it++){ const d=surfJS(px,pz); px=x-d.x; pz=z-d.z; }
    const d=surfJS(px,pz); out.h=d.y; out.nx=d.nx; out.ny=d.ny; out.nz=d.nz; return out; }
  const _s={h:0,nx:0,ny:1,nz:0};
  const heightAt=(x,z)=>sample(x,z,_s).h;
  const normalAt=(x,z,out={x:0,y:1,z:0})=>{ sample(x,z,_s); out.x=_s.nx; out.y=_s.ny; out.z=_s.nz; return out; };

  /* ---------- the mesh: a disc of rings, close together round its middle ---------- */
  const disc=(NR,NA)=>{ const R0=O.radius, P=[0,0,0], I=[];
    for (let r=1;r<=NR;r++){ const rad=R0*Math.pow(r/NR,3); for (let a=0;a<NA;a++){ const t=a/NA*TAU; P.push(Math.cos(t)*rad,0,Math.sin(t)*rad); } }
    const v=(r,a)=>r===0?0:1+(r-1)*NA+(a%NA);
    for (let a=0;a<NA;a++) I.push(0,v(1,a),v(1,a+1));
    for (let r=1;r<NR;r++) for (let a=0;a<NA;a++){ const p=v(r,a), q=v(r,a+1), s=v(r+1,a), t=v(r+1,a+1); I.push(p,s,t,p,t,q); }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(P,3)); g.setIndex(I); return g; };
  // two levels of detail: the full sea, and a coarse one for the sea seen from land, without the ripples, the gusts
  // and the light on the sea bed. The spacing the waves are faded by eases between the two, and the coarse mesh is
  // used only once the detail has eased to nothing, so the change is never seen at once
  const geo=disc(O.rings,O.segs), geoC=O.coarse?disc(O.coarse[0],O.coarse[1]):geo;
  const spcF=3*Math.pow(O.radius,1/3)/O.rings, spcC=O.coarse?3*Math.pow(O.radius,1/3)/O.coarse[0]:spcF;
  U.uSpc.value=spcF;
  const mat=new THREE.ShaderMaterial({uniforms:THREE.UniformsUtils.merge([THREE.UniformsLib.fog,{}]),fog:true,transparent:true,depthWrite:true,side:THREE.DoubleSide,
    vertexShader:`${GLSL}
      varying vec3 vP; varying vec3 vN; varying float vFold, vDepth, vSwl, vH, vWf; varying vec2 vQ;
      #include <fog_pars_vertex>
      void main(){
        vec3 wp=(modelMatrix*vec4(position,1.0)).xyz; vec2 q0=wp.xz+uOff.xz; vec3 dp, nr; float fo, swl; seaSurf(q0,dp,nr,fo,swl);
        vec3 fa=seaField(q0); vec3 p=wp+dp; vP=p; vN=nr; vFold=fo; vDepth=fa.z; vWf=fa.y; vSwl=swl; vH=dp.y; vQ=q0+dp.xz;
        vec4 mvPosition=viewMatrix*vec4(p,1.0); gl_Position=projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`
      uniform vec3 uSunDir, uSunCol, uSkyTop, uSkyHor, uDeep, uMid, uThin, uShallow, uFoam; uniform float uTime, uWind, uWhite, uBright, uSwellA;
      uniform vec2 uWindDir; uniform sampler2D uGustTex; uniform vec4 uGust; uniform float uGustAmt;
      uniform sampler2D uScene, uSceneDepth; uniform vec2 uRes; uniform mat4 uProjInv, uCamWorld; uniform float uClarity, uHasScene, uPassFar, uDetail;
      varying vec3 vP; varying vec3 vN; varying float vFold, vDepth, vSwl, vH, vWf; varying vec2 vQ;
      uniform float uGustC; uniform vec3 uOff; uniform sampler2D uField; uniform vec4 uFieldR; uniform vec3 uOutside;
      // the shore field again, read for each pixel, so that the edges of the shallows follow the sea bed and not the mesh
      vec3 seaFieldF(vec2 p){ vec2 f=(p-uFieldR.xy)/uFieldR.z; if (f.x<0.0||f.y<0.0||f.x>uFieldR.w-1.0||f.y>uFieldR.w-1.0) return uOutside;
        vec3 v=texture2D(uField,(f+0.5)/uFieldR.w).rgb; return vec3(v.x*1.5,v.y*1.5,v.z*20.0); }
      #include <common>
      #include <fog_pars_fragment>
      float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h2(i),h2(i+vec2(1,0)),f.x),mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),f.x),f.y); }
      mat2 rot2(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }

/* ---------- sound: the heart as breath runs out, the muffled sea under the water, splashes and a gasp at the surface ---------- */
// The underwater ambience is Reef's loop (sounds/underwater.mp3, to be the 'underwater' entry of sounds.json); the
// shore's waves (sounds/shore-waves.mp3, 'water_lap') stand for the sounds above the water, which are muffled and
// lowered while the ears are under. The two are mixed by how much of the lens is in the water, easing over about
// 0.3 s. An MP3 carries the encoder's silence at both ends, so each loop runs between its first and last audible
// samples, which closes the gap at the seam.
const audio={ctx:null};
function trimmedLoop(buf){ let a=0, b=buf.length-1; const th=1e-4, ch=[...Array(buf.numberOfChannels)].map((_,i)=>buf.getChannelData(i));

// above the water: the scene without the sea into a target with a depth texture, for the water to look into, then

const _sz=new THREE.Vector2();
const behind=new THREE.WebGLRenderTarget(1,1,{type:THREE.HalfFloatType,depthTexture:new THREE.DepthTexture(1,1)});

  get mode(){ return mode; }, set mode(m){ mode=m; },
