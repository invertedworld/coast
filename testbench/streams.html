<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import * as FL from './streams-flora.js';

/* Mountain streams: a model for the game.

   The page builds a hillside about 1.8 km long, from a ridge at the north (-z) down to the sea at the south (+z), and
   one stream that rises at a spring high on it and runs down to the sea. The query string chooses what is shown:
   ?v=overview|reach|reach15|fall|cascade|source|mouth|village &seed=<n> &g=<gradient> &m=<meanders> &d=<drop height in m>
   &w=<width in m> &h=<hour> &vil=valley|across|none &panel=0.

   Course. A stream rises at a source placed from the seed high on the slope (in the game, one candidate source to a
   slot of a coarse grid along the range, like the slots of the islands). From there its course is traced down the
   uncarved ground, baseH, in steps of 8 m: at each step the next point is the lowest of eleven on a fan of headings
   within 75 degrees of the present one, read on a slightly smoothed height and with a small cost for turning, so that
   the course follows the floor of whatever valley it finds. It may not come back within 10 m of itself, and it may
   rise by no more than 4 m above the lowest point it has reached, which carries it over small hollows. The trace ends
   1.5 m below the sea. It reads only baseH and the village test, never the carved height, so there is no circularity.

   Villages. A course that passes within 26 m of a village block (isVillage(cx,cz) in the game) is traced again from
   24 m above that point with village blocks and a margin of 10 m about them forbidden. If that detour comes back to
   the first course below the village without rising more than 4 m, it is used and the stream bends round the
   village. Otherwise the stream goes underground for the width of the village, in a culvert with a stone headwall
   and arch at each end, and keeps its first course beneath the houses, with no channel and no water there.

   Plan. The traced line is smoothed into a valley line, sampled every 2 m, and a meander is laid on it as a sideways
   offset: a sine of wavelength about fourteen channel widths with an amplitude of 0.15 of that wavelength, and a
   longer, gentler swing of three wavelengths on the gentlest ground. Both fade on steep ground (above a slope of about
   0.16 only a sixth of the short meander remains, so the course is straighter there), near a village, round a culvert
   and at the two ends. The result is resampled every 0.5 m by length; its heading gives the curvature at each sample,
   smoothed over 6 m, whose sign says which bank is the outer one of a bend.

   Long profile. Along the course the ground is read at the centre and at both banks (the lowest of the three, so that
   the water is held on both sides), smoothed over 20 m and never allowed to rise downstream. The bed aims to lie an
   incision depth below this, of 1 m plus a fifth of the width, plus 8 m for each unit of slope, so that the channel is
   cut deeper where the hillside is steep. The bed itself falls only gently, by 0.4 per cent and a further 3.5 per cent
   of the hillside's slope, so that each reach is nearly level. Whenever the bed would stand more than about a third of
   a drop above its aim, and the last drop is far enough upstream, the bed drops: by the drop height, scaled up on
   steep ground (by a factor of 0.5 plus six times the slope) and varied from drop to drop, with one in eight of the
   drops on steep ground made over twice as high. So the profile is a staircase of gentle reaches and falls; on steep
   ground the steps come every 10 to 15 m as a step and pool cascade, on the coastal plain every 50 m or so as low
   weirs. Below each drop the bed is scoured into a plunge pool, deepest a little beyond where the jet lands and
   shoaling to a tail, to a depth of 0.25 m plus 0.3 of the drop, and the channel is widened there by up to half.

   Carving. The stream is a modification of the height function: h = smin(ground, channel), a smooth minimum with
   0.5 m of blending. The channel's height at a point comes from the nearest point of the course (its distance along,
   t, and signed distance across, n) as a cross-section: a bed slightly deepest at the middle and on the outer side of a
   bend; on the outer bank a steep cut bank; on the inner bank a point bar of gravel rising gently from the water, then
   a gentler bank; above the bank top the valley side, at a slope of 0.75 rising to about 2 near a high fall, where it
   stands as rock walls, and to 3 at a culvert, where it is a walled cut. Where the hillside is steep the cut is deep
   and narrow, and where it is gentle the channel is a shallow trough in a broad bottom. Near the sea the depth tapers
   and the bed is held at 0.35 m below the sea, so that the stream cuts a gap through the beach, and a fan of gravel is
   laid on the sea bed off the mouth.

   Erosion detail. The ground is coloured from the same cross-section: pebbles on the bed, bare bedrock in the steep
   reaches and on and round every fall, pale gravel on the point bars, dark earth on the cut banks under an overhanging
   lip of turf, a wet band at the water's edge and a greener strip of grass along the banks. Boulders lie in the bed,
   more and larger on steep ground, round the rims and tails of the pools and at the foot of the cut banks; pebbles are
   strewn on the bars and the bed; a lip of rock blocks stands across the head of each fall, with larger blocks in the
   banks beside it. Oleanders grow along the banks below the high ground, oriental planes beside the lower reaches and
   giant cane near the sea.

   Water. The water stands 0.14 m plus 3 per cent of the width above the bed's staircase (the pools are therefore deeper,
   with a level surface), so it lies well below the banks. Its surface is a ribbon along the course whose edges are found
   where the carved ground rises out of it, and at each fall it pours from the lip as a curtain on a falling arc and
   lands in the pool. The shader draws ripples moving downstream, a clear shallow tint that shows the bed and a deeper
   green in the pools, the sky's reflection at a grazing angle, and white water from a foam value carried by each vertex:
   full on the curtains, spreading and fading over the pool below each fall, and starting at the lip.

   In the game. Every part above is a pure function of the seed and of baseH, so a block can be built alone:
   - streamInfo(slot), cached like islandInfo, traces the course of the stream of a source slot, its plan, long profile,
     drops, pools and water edges once, and holds them as arrays every 0.5 m with an index of 32 m cells;
     streamsNear(cx,cz) lists the streams whose index has a cell within 48 m of a block.
   - heightAtExact (and so heightAt and the hgTiles cache) applies h = smin(h, streamChannel(x,z)) after baseH and before
     the streets and squares, which keep away from the channel. baseH itself is not changed, since the courses read it.
   - isVillage must not read the carved height. The course reads isVillage, and villages, streets, the railway and
     the station yards are kept off the channel by a margin: the street and rail code would need bridges or culverts
     where they cross a stream, which this page does not model.
   - The ground colouring in buildChunk takes the zone, the distance along and the distance across from the same query,
     as this page's streamColour does; the boulders, pebbles, lips and plants are added to the block's geometry
     builder (GB) from the course samples inside the block; the water ribbon is built per block from the samples
     inside it, with its own material, beside the sea's surface.
   - The bank plants would use the game's own oleander, plane and cane once they exist in the trees testbench. */

/* ---------- from index.html: random numbers, noise and the palette ---------- */
let SEED=1;
function hash(a,b,c){
  let h = Math.imul(a|0,0x27d4eb2d) ^ Math.imul(b|0,0x165667b1) ^ Math.imul(((c|0)+SEED*977)|0,0x9e3779b1);
  h = Math.imul(h ^ (h>>>15), 0x85ebca6b); h = Math.imul(h ^ (h>>>13), 0xc2b2ae35); h ^= h>>>16;
  return (h>>>0)/4294967296;
}
function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s=(s+0x6D2B79F5)|0; let t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function vnoise(x,z,s){
  const xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash(xi,zi,s), b=hash(xi+1,zi,s), c=hash(xi,zi+1,s), d=hash(xi+1,zi+1,s);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,z,s,o=4){ let a=0.5,f=1,sum=0,n=0; for (let i=0;i<o;i++){ sum+=a*vnoise(x*f,z*f,s+i*7); n+=a; a*=0.5; f*=2.03; } return sum/n; }
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const hex=h=>new THREE.Color(h);
const PAL={
  walls:['#f3e4d0','#efd6bf','#f6ebdd','#eacbb0','#f1dcc4','#e9c3ab','#f4dfcc','#edd0b8','#f2d8c8'],
  roofs:['#d65a52','#de6b5b','#cc514c','#d8645a','#c94f48','#dd5f55'], win:'#3a2b2b', door:'#6a4530',
  stone:'#dcc6ab', stoneDark:'#c4ad92', terrace:'#efd8c1', sand:'#dcb886', sand2:'#e6c99a', road:'#e9d2a6', piazza:'#efdcb6',
  grass:'#a6a661', grass2:'#8f9a53', scrub:'#9a9a5c', rock:'#b8a48e', beach:'#ecd9ad', seabed:'#4f7f91', foam:'#f4f1e8',
  leaf:['#4e6a2c','#5b7834','#465f27','#62803a'], olive:'#7f8b55', cypress:'#36502a', trunk:'#6a4a30', water:'#3f86c0',
};
const C_={}; for (const k in PAL) C_[k]=Array.isArray(PAL[k])?PAL[k].map(hex):hex(PAL[k]);
const shade=(c,R,a=0.05)=>c.clone().multiplyScalar(1+(R()-0.5)*2*a);
const GREY_ROCK=hex('#9a948a'), LIMESTONE=hex('#cfc7b6'), DRYGRASS=hex('#a8a465'), DIRT=hex('#c4a57c'), GRAVEL=hex('#8f8577');
const MT_ROCK=hex('#a5aba6'), MT_PALE=hex('#c2c8c4'), MT_SCREE=hex('#82877c'), MT_MAQUIS=hex('#56643f'), MT_GARRIGUE=hex('#7d8a6c');
const _mtC=new THREE.Color();
// the colour of high ground, as in the game (without the snow, which this hillside does not reach)
function mtTint(c,h,slope,n=0.5,p=0.5){ if (h<110) return c;
  const m=smooth((h-110)/70)*(1-smooth((h-280)/150))*(1-smooth((slope-0.65)/0.6));
  if (m>0) c.lerp(_mtC.copy(MT_GARRIGUE).lerp(MT_MAQUIS,smooth((n*0.4+p*0.6-0.35)/0.3)),Math.min(0.85,m*0.9));
  const k=Math.max(smooth((h-170)/200),smooth((slope-0.7)/0.6)*smooth((h-120)/60)*0.9);
  if (k>0) c.lerp(_mtC.copy(MT_ROCK).lerp(MT_PALE,smooth((p-0.45)/0.3)*0.8).lerp(MT_SCREE,clamp((slope-0.5)*1.4,0,1)*0.8+n*0.2),k);
  return c; }
// the stream's own colours
const PEB_A=hex('#8f8169'), PEB_B=hex('#575046'), BAR_A=hex('#ddd5c4'), BAR_B=hex('#a99f8e'), BEDROCK=hex('#c3bdb1'), BEDROCK2=hex('#9c968c'),
  EARTH=hex('#86694c'), EARTH_D=hex('#6a5340'), RIPARIAN=hex('#6f8a3c'), SHINGLE=hex('#b5ab9b'), SHINGLE2=hex('#d7cfbf');

/* ---------- the settings ---------- */
const Q=new URLSearchParams(location.search);
const num=(k,d)=>Q.has(k)&&isFinite(+Q.get(k))?+Q.get(k):d;
const state={ seed:Math.max(1,Math.round(num('seed',3))), grad:num('g',0.2), mea:num('m',1), drop:num('d',1.4), width:num('w',3),
  hour:num('h',15), vil:Q.get('vil')||'valley', view:Q.get('v')||'overview' };

/* ---------- the hillside ---------- */
// The ground rises from the shore, about z=780, to a ridge at z=-1020, steeply near the top and gently near the sea,
// with a broad valley winding down it, spurs and hollows on its sides, and a beach of 28 m at the foot
const ZS=780, ZR=-1020, LEN=ZS-ZR, BEACH=28, CB=40;
let TP={}, HTOP=360;
function setTerrain(){ SEED=state.seed; const R=rng(state.seed*7919+13);
  TP={a1:R()*6.28,a2:R()*6.28,a3:R()*6.28,a4:R()*6.28,vx:(R()-0.5)*160,s:Math.floor(R()*900)}; HTOP=state.grad*LEN; }
function shoreZ(x){ return ZS+22*Math.sin(x*0.0041+TP.a1)+10*Math.sin(x*0.013+TP.a2); }
function valleyX(z){ return TP.vx+130*Math.sin(z*0.0024+TP.a3)+45*Math.sin(z*0.0067+TP.a4); }
function hill(u){ return HTOP*(0.1*u+0.9*Math.pow(u,1.75)); }
function baseH(x,z){
  const e=shoreZ(x)-z;
  if (e<=0) return -14*(1-Math.exp(e/280));
  let u=Math.max(0,e-BEACH)/LEN; if (u>1) u=Math.max(0.25,1-(u-1)*1.4);
  const hb=hill(u), dx=x-valleyX(z), vw=150+50*vnoise(z*0.004,1.7,TP.s+3);
  let h=hb*(1-0.2*Math.exp(-dx*dx/(2*vw*vw)));
  h+=hb*0.16*(fbm(x*0.0035,z*0.0035,TP.s+5,3)-0.5)*2;
  h+=(1.2+hb*0.012)*(fbm(x*0.03,z*0.03,TP.s+9,2)-0.5)*2*smooth((e-BEACH)/30);
  return 1.6*Math.min(1,e/BEACH)+Math.max(h,-1);
}
function smoothH(x,z){ return (2*baseH(x,z)+baseH(x+6,z)+baseH(x-6,z)+baseH(x,z+6)+baseH(x,z-6))/6; }

/* ---------- the village: a stand-in for the game's isVillage ---------- */
let VB=[]; const VM=10;
function isVillage(cx,cz){ for (const b of VB) if (b.cx===cx&&b.cz===cz) return true; return false; }
function vDist(x,z){ let d=1e9;
  for (const b of VB){ const dx=Math.max(b.x0-x,0,x-b.x1), dz=Math.max(b.z0-z,0,z-b.z1);
    d=Math.min(d,dx===0&&dz===0?-Math.min(x-b.x0,b.x1-x,z-b.z0,b.z1-z):Math.hypot(dx,dz)); }
  return d; }

/* ---------- the course ---------- */
const RISE=4;
function gradDir(x,z){ const gx=smoothH(x+4,z)-smoothH(x-4,z), gz=smoothH(x,z+4)-smoothH(x,z-4); return Math.atan2(-gz,-gx); }
function trace(x,z,avoid,join){
  const STEP=8, pts=[[x,z]]; let hd=gradDir(x,z), low=smoothH(x,z);
  for (let k=0;k<700;k++){
    let best=null;
    for (let d=-75;d<=75;d+=15){ const a=hd+d*Math.PI/180, nx=x+Math.cos(a)*STEP, nz=z+Math.sin(a)*STEP;
      if (avoid && vDist(nx,nz)<VM) continue;
      const h=smoothH(nx,nz); let c=h+Math.abs(d)*0.004;
      for (let q=0;q<pts.length-2;q++){ const p=pts[q]; if ((p[0]-nx)**2+(p[1]-nz)**2<100){ c+=1e4; break; } }
      if (!best||c<best.c) best={c,a,x:nx,z:nz,h}; }
    if (!best||best.c>=1e4||best.h>low+RISE) return {pts,stuck:true};
    low=Math.min(low,best.h); x=best.x; z=best.z; pts.push([x,z]); hd=best.a;
    if (join){ const j=join(x,z); if (j>=0) return {pts,stuck:false,join:j}; }
    if (baseH(x,z)<-1.5) return {pts,stuck:false};
  }
  return {pts,stuck:true};
}
function findCourse(){
  const R=rng(state.seed*31+7), zs=ZR+170+R()*50, xs=valleyX(zs)+(R()-0.5)*50;
  const nat=trace(xs,zs,false,null).pts;
  // the village stands on the first course where it crosses z=235, on the valley floor or across the whole valley
  VB=[];
  if (state.vil!=='none'){ let best=nat[0]; for (const p of nat) if (Math.abs(p[1]-235)<Math.abs(best[1]-235)) best=p;
    const [l,r]=state.vil==='across'?[-260,260]:[-30,50];
    for (let cx=Math.floor((best[0]+l)/CB); cx<=Math.floor((best[0]+r)/CB); cx++) for (let cz=(state.vil==='across'?4:5);cz<=6;cz++) VB.push({cx,cz,x0:cx*CB,z0:cz*CB,x1:cx*CB+CB,z1:cz*CB+CB}); }
  let pts=nat, culv=null, route='none';
  if (VB.length){ let a=-1, b=-1; nat.forEach((p,i)=>{ if (vDist(p[0],p[1])<VM+16){ if (a<0) a=i; b=i; } });
    if (a>=0){ const s0=Math.max(0,a-3);
      const det=trace(nat[s0][0],nat[s0][1],true,(x,z)=>{ if (vDist(x,z)<VM+16) return -1;
        for (let i=b+1;i<nat.length;i++) if ((nat[i][0]-x)**2+(nat[i][1]-z)**2<144) return i; return -1; });
      if (!det.stuck && (det.join===undefined || det.pts.length<4*(det.join-s0)+10)){
        pts=nat.slice(0,s0).concat(det.pts, det.join!==undefined?nat.slice(det.join+1):[]); route='round'; }
      else { let ca=-1, cb=-1; nat.forEach((p,i)=>{ if (vDist(p[0],p[1])<VM){ if (ca<0) ca=i; cb=i; } }); culv=[ca-1,cb+1]; route='culvert'; } } }
  return {pts,culv,route};
}

// the course's samples, every 0.5 m along it
const DS=0.5;
let OBS=[], NS=0, DRS=null, X,Z,TX,TZ,S,U,KAP,HW,BED,BANKB,SPRAY,SC,WID,BH,KV,BAR,WL,ROCK,CULV,SLOPE,GM,EL,ER, DROPS=[], CULVR=null, ROUTE='none', ISEA=0, MOUTH=null, RKAP=6, DRUN=0.23;
const F32=n=>new Float32Array(n);
function boxSmooth(A,r,lo=0,hi=A.length-1){ const B=A.slice(); for (let i=lo;i<=hi;i++){ let s=0,n=0; for (let k=Math.max(lo,i-r);k<=Math.min(hi,i+r);k++){ s+=A[k]; n++; } B[i]=s/n; } return B; }
function buildCourse(){
  const fc=findCourse(); CULVR=fc.culv; ROUTE=fc.route;
  let P=fc.pts.map(p=>[p[0],p[1]]);
  for (let it=0;it<2;it++){ const Qp=P.map(p=>p.slice()); for (let i=1;i<P.length-1;i++) for (let k=0;k<2;k++) Qp[i][k]=(P[i-1][k]+2*P[i][k]+P[i+1][k])/4; P=Qp; }
  // the valley line, every 2 m
  let cx=[], cz=[]; const cu=[];
  for (let i=0;i<P.length-1;i++){ const d=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]), n=Math.max(1,Math.round(d/2));
    for (let k=0;k<n;k++){ const f=k/n; cx.push(lerp(P[i][0],P[i+1][0],f)); cz.push(lerp(P[i][1],P[i+1][1],f)); cu.push(i+f); } }
  cx.push(P[P.length-1][0]); cz.push(P[P.length-1][1]); cu.push(P.length-1);
  const n0=cx.length, inCulv=u=>CULVR && u>=CULVR[0] && u<=CULVR[1];
  for (let it=0;it<2;it++){ cx=boxSmooth(cx,6); cz=boxSmooth(cz,6); }
  for (let pass=0;pass<2;pass++){
    if (VB.length) for (let k=0;k<n0;k++){ if (inCulv(cu[k])) continue;

  for (const m of [streamMat,seaMat]){ const u=m.uniforms; u.uSun.value.copy(SUN_DIR); u.uSunC.value.copy(sun.color).multiplyScalar(sun.intensity);
    sprayMat.uniforms.uCol.value.copy(hemi.color).multiplyScalar(hemi.intensity*0.85).add(_t.copy(sun.color).multiplyScalar(sun.intensity*0.55)).multiplyScalar(0.3183*0.95);
    foamMat.uniforms.uCol.value.copy(sprayMat.uniforms.uCol.value); foamMat.uniforms.uSun.value.copy(SUN_DIR);
    u.uSkyC.value.copy(hemi.color).lerp(hemi.groundColor,0.25).multiplyScalar(hemi.intensity); u.uRefl.value.copy(skyU.uHor.value).lerp(skyU.uMid.value,m===seaMat?0.85:0.35); u.uReflTop.value.copy(skyU.uMid.value).lerp(skyU.uTop.value,0.5); }
  const h=Math.floor(state.hour), mi=Math.round((state.hour-h)*60); document.getElementById('hV').textContent=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
}

let world=null, INFO={};
function build(){
  const t0=performance.now();
  if (world){ scene.remove(world); world.traverse(o=>{ if (o.geometry) o.geometry.dispose(); }); }
  world=new THREE.Group(); scene.add(world);
  setTerrain(); MOUTH=null; buildCourse(); profile(); buildIndex(); classify();
  const t1=performance.now();
  for (const [k,kd] of KIND){ const cx=Math.floor(k/1000)-100, cz=k%1000-100; world.add(blockMesh(cx,cz,kd===2?0.5:1)); }
  world.add(coarseMesh()); world.add(channelMesh());
  const t2=performance.now();
  VG=new FL.GB(0); const gb=buildProps(); buildLand(gb); world.add(gb.mesh(propMat)); world.add(buildPlants());
  world.add(waterMesh()); world.add(seaMesh()); world.add(sprayMesh()); world.add(foamRingMesh());
  if (VG.p.length){ const m=new THREE.Mesh(VG.geometry(0,0),floraMat); m.castShadow=true; world.add(m); }
  const t3=performance.now();
  // the figures shown below the settings
  let tall=0; for (const d of DROPS) tall=Math.max(tall,d.H);
  const len=S[ISEA], straight=Math.hypot(X[ISEA]-X[0],Z[ISEA]-Z[0]), plan=(()=>{ let l=0; for (let i=1;i<=ISEA;i++) l+=Math.hypot(X[i]-X[i-1],Z[i]-Z[i-1]); return l; })();
  const big=DROPS.filter(d=>d.H>=2).length, cul=CULV.reduce((a,v)=>a+v,0)*DS;
  const cls=[[0,0.08],[0.08,0.16],[0.16,9]].map(([a,b])=>{ let L=0, n=0; for (let i=0;i<=ISEA;i++) if (SLOPE[i]>=a&&SLOPE[i]<b&&!CULV[i]) L+=DS; for (const d of DROPS) if (d.i<=ISEA&&SLOPE[d.i]>=a&&SLOPE[d.i]<b) n++; return {km:L/1000,drops:n,perKm:L>0?n/(L/1000):0}; });
  INFO={length:len, drops:DROPS.length, byGround:cls, big, tallest:tall, sinuosity:plan/straight, source:BED[0], route:ROUTE, culvert:cul, ms:{course:t1-t0,ground:t2-t1,rest:t3-t2}};
  document.getElementById('stats').innerHTML=
    `Length ${(len/1000).toFixed(2)} km, from ${GM[0].toFixed(0)} m<br>Drops ${DROPS.length}, of 2 m or more ${big}, highest ${tall.toFixed(1)} m<br>Sinuosity ${(plan/straight).toFixed(2)}`+
    (ROUTE==='round'?'<br>Village: course turned round it':ROUTE==='culvert'?`<br>Village: culvert of ${cul.toFixed(0)} m`:'')+
    `<br>Built in ${((t3-t0)/1000).toFixed(1)} s`;
  console.log('streams',JSON.stringify(INFO));
}

/* ---------- the views ---------- */
function aim(){
  const v=state.view; let pos, tgt, near=0.1, fogN=150, fogF=2400, sh=70;
  const ground=(x,z)=>terrainAt(x,z);
  const lift=(p,min)=>{ const g=ground(p[0],p[2]); if (p[1]<g+min) p[1]=g+min; return p; };
  if (v==='overview'){ let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9; for (let i=0;i<NS;i+=20){ x0=Math.min(x0,X[i]); x1=Math.max(x1,X[i]); z0=Math.min(z0,Z[i]); z1=Math.max(z1,Z[i]); }
    const m=at(S[ISEA]), mid=at(S[ISEA]*0.5);
    pos=[m.x+260,330+HTOP*0.55,m.z+330]; tgt=[mid.x,GM[Math.round(mid.t)]*0.7,mid.z]; near=1; fogN=2200; fogF=7000; sh=1200; }
  else if (v==='reach'||v==='reach15'){
    // a gentle reach with a good bend, well clear of any fall
    let best=-1, bs=-1; for (let i=Math.floor(NS*0.45);i<ISEA-120;i+=4){ if (CULV[i]) continue; const kk=Math.abs(KAP[i])*RKAP;
      if (DROPS.some(d=>Math.abs(S[d.i]-S[i])<22)) continue; const sc=Math.min(1,kk)+0.35*Math.min(2,GM[i]-WL[i])-SLOPE[i]*3; if (sc>bs){ bs=sc; best=i; } }
    if (best<0) best=Math.floor(NS*0.7);
    const inner=KAP[best]>0?1:-1, a=at(S[best]-(v==='reach'?5:9)), b=at(S[best]+(v==='reach'?5:2)), hs=HW[best], bar=BAR[best]*Math.min(1,Math.abs(KAP[best])*RKAP);
    const off=v==='reach'?hs+bar*0.55:hs+14;
    pos=[a.x+a.nx*inner*off,0,a.z+a.nz*inner*off]; pos[1]=ground(pos[0],pos[2])+(v==='reach'?1.6:7);
    tgt=[b.x-b.nx*inner*hs*0.3,WL[Math.round(b.t)]+0.2,b.z-b.nz*inner*hs*0.3]; sh=40; }
  else if (v==='fall'){
    let d=DROPS[0]; for (const q of DROPS) if (q.H>d.H && S[q.i]>60) d=q;
    const H=d.H, i=d.i, p=at(d.s), c=at(d.s+6+1.2*H), side=KAP[i]>0?1:-1, hs=HW[i];
    const c2=at(d.s+9+2.2*H); pos=[c2.x+c2.nx*side*0.5,d.top+BH[i]+1.2,c2.z+c2.nz*side*0.5]; lift(pos,1.2);
    tgt=[p.x,d.top-H*0.45,p.z]; sh=40; }
  else if (v==='brink'){
    // side on to the lip of the highest fall, to show the water bending over it
    let d=DROPS[0]; for (const q of DROPS) if (q.H>d.H && S[q.i]>60) d=q;
    const p=at(d.sLip+0.4), side=KAP[d.i]>0?-1:1, off=HW[d.i]+1.2;
    const c=at(d.sLip+d.th+2.2); pos=[c.x+c.nx*side*HW[d.i]*0.7,d.wlTop+0.4,c.z+c.nz*side*HW[d.i]*0.7]; lift(pos,0.5); tgt=[p.x-p.tx*0.6,d.wlTop-0.25,p.z-p.tz*0.6]; sh=20; }
  else if (v==='cascade'){
    let best=0, bc=-1; for (let k=0;k<DROPS.length;k++){ let c=0, hsum=0; for (let q=k;q<DROPS.length && S[DROPS[q].i]-S[DROPS[k].i]<60;q++){ c++; hsum+=DROPS[q].H; } if (hsum>bc){ bc=hsum; best=k; } }
    const d0=DROPS[best]; let last=d0; for (let q=best;q<DROPS.length && S[DROPS[q].i]-S[d0.i]<60;q++) last=DROPS[q];
    const c=at(S[last.i]+12), p=at((S[d0.i]+S[last.i])/2);
    pos=[c.x,WL[Math.round(c.t)]+5,c.z]; lift(pos,2.5);
    tgt=[p.x,BED[Math.round(p.t)]+0.5,p.z]; sh=60; }
  else if (v==='source'){ const c=at(9), p=at(0); pos=[c.x+c.nx*3.2,0,c.z+c.nz*3.2]; pos[1]=ground(pos[0],pos[2])+1.7; tgt=[p.x-p.tx*1.2,BED[0]+0.5,p.z-p.tz*1.2]; sh=30; }
  else if (v==='mouth'){ const m=at(S[ISEA]), up=at(S[ISEA]-70);
    pos=[m.x+m.tx*13+m.nx*9,3.2,m.z+m.tz*13+m.nz*9]; tgt=[m.x-m.tx*10,0.4,m.z-m.tz*10]; sh=50; }
  else if (v==='village' && CULVR){ let a=-1; for (let i=0;i<NS;i++) if (CULV[i]){ a=i; break; }
    const p=at(S[a]-1), c=at(S[a]-16), side=KAP[a]>0?1:-1; pos=[c.x+c.nx*side*7,0,c.z+c.nz*side*7]; pos[1]=ground(pos[0],pos[2])+3.5; tgt=[p.x,BED[a]+1.2,p.z]; sh=60; }
  else if (v==='village'){ let x=0,z=0; if (VB.length){ for (const b of VB){ x+=b.x0+20; z+=b.z0+20; } x/=VB.length; z/=VB.length; } else { const p=at(S[NS-1]*0.55); x=p.x; z=p.z; }
    const g=groundAt(x,z); pos=[x+170,g+150,z+190]; tgt=[x,g,z-10]; near=0.5; sh=320; fogN=600; fogF=4000; }
  camera.near=near; camera.updateProjectionMatrix(); scene.fog.near=fogN; scene.fog.far=fogF;
  Object.assign(sun.shadow.camera,{left:-sh,right:sh,top:sh,bottom:-sh,near:1,far:Math.max(500,sh*4)}); sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.normalBias=sh>200?0.4:0.03;
  camera.position.set(...pos); controls.target.set(...tgt); controls.update();
}

/* ---------- the panel ---------- */
const el=id=>document.getElementById(id);
const fmt={g:v=>Math.round(v*100)+' %',m:v=>v.toFixed(2),d:v=>v.toFixed(2)+' m',w:v=>v.toFixed(1)+' m'};
const keys={g:'grad',m:'mea',d:'drop',w:'width'};
function syncPanel(){ el('view').value=state.view; el('vil').value=state.vil; el('seed').value=state.seed; el('h').value=state.hour;
  for (const k in keys){ el(k).value=state[keys[k]]; el(k+'V').textContent=fmt[k](state[keys[k]]); } }
function rebuild(){ build(); aim(); }
el('view').onchange=e=>{ state.view=e.target.value; aim(); };
el('vil').onchange=e=>{ state.vil=e.target.value; rebuild(); };
el('seed').onchange=e=>{ state.seed=Math.max(1,Math.round(+e.target.value||1)); rebuild(); };
el('next').onclick=()=>{ state.seed++; el('seed').value=state.seed; rebuild(); };
for (const k in keys){ el(k).oninput=e=>{ el(k+'V').textContent=fmt[k](+e.target.value); }; el(k).onchange=e=>{ state[keys[k]]=+e.target.value; rebuild(); }; }
el('h').oninput=e=>{ state.hour=+e.target.value; daylight(); };
if (Q.get('panel')==='0') el('panel').classList.add('hide');
function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
syncPanel(); daylight(); build(); aim();
const clock=new THREE.Clock(); let frames=0;
renderer.setAnimationLoop(()=>{ const t=clock.getElapsedTime(); streamMat.uniforms.uTime.value=t; seaMat.uniforms.uTime.value=t; sprayMat.uniforms.uTime.value=t; foamMat.uniforms.uTime.value=t;
  sprayMat.uniforms.uScale.value=renderer.domElement.height/(2*Math.tan(camera.fov*Math.PI/360));
  controls.update(); sun.target.position.copy(controls.target); sun.position.copy(controls.target).addScaledVector(SUN_DIR,Math.max(300,camera.far*0.2)); sky.position.copy(camera.position);
  renderer.render(scene,camera); if (++frames===3) window.__streams.ready=true; });
window.__streams={state,info:()=>INFO,ready:false,set(o){ Object.assign(state,o); syncPanel(); daylight(); if (o.view && Object.keys(o).length===1) aim(); else rebuild(); },
  drops:()=>DROPS.map(d=>({s:S[d.i],H:d.H})), show(name,v){ world.traverse(o=>{ if (o.name===name) o.visible=v; }); }, noShadow(){ sun.castShadow=false; renderer.shadowMap.needsUpdate=true; }};
</script>
