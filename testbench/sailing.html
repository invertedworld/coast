<!doctype html>
<title>Coast: sailing</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* The testbench uses the panel style of Coast: plaster text on a translucent sea-blue panel. */
:root{
  --sea:#1d5189; --sea-deep:#123761; --plaster:#f5e9d7; --plaster-dim:#d9c8b0;
  --coral:#d85d52; --verdigris:#7cc3ad; --ink:#26232b;
  --panel:rgba(18,55,97,.86); --line:rgba(245,233,215,.22);
  --font-display:'Marcellus','Trajan Pro',Georgia,serif;
  --font-body:'Alegreya Sans','Gill Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);color:var(--plaster);font-family:var(--font-body);font-size:16px}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.panel{position:fixed;z-index:4;top:16px;left:16px;width:min(300px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;box-sizing:border-box;background:var(--panel);
  border:1px solid var(--line);border-radius:4px;padding:14px 16px 16px;backdrop-filter:blur(8px);font-size:.95rem;line-height:1.3}
.panel h1{margin:0 0 10px;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.panel h2{margin:14px 0 4px;font-family:var(--font-display);font-weight:400;font-size:1.02rem;color:var(--plaster-dim)}
.panel .row{display:grid;grid-template-columns:7.2em 1fr 5.4em;align-items:center;gap:8px;padding:5px 0}
.panel .row.two{grid-template-columns:7.2em 1fr}
.panel label{color:var(--plaster-dim)}
.panel output{text-align:right;font-variant-numeric:tabular-nums;font-size:.88rem}
.panel input[type=range]{width:100%;accent-color:var(--verdigris)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;border-radius:0;border:0}
button{font:500 .9rem/1 var(--font-body);color:var(--plaster);background:rgba(245,233,215,.08);border:1px solid var(--line);border-radius:3px;padding:7px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--plaster);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.actions button{flex:1 1 40%}
.dbg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:.88rem}
.dbg span:nth-child(odd){color:var(--plaster-dim)}
.dbg span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
#polar{display:block;width:100%;height:auto;margin-top:8px}
.hud{position:fixed;z-index:4;right:16px;bottom:16px;width:132px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:4px;
  padding:10px 10px 8px;backdrop-filter:blur(8px);text-align:center;font-variant-numeric:tabular-nums}
.hud svg{display:block;width:100px;height:100px;margin:0 auto 4px}
.hud .v{display:flex;justify-content:space-between;font-size:.9rem;padding:1px 2px}
.hud .v span:first-child{color:var(--plaster-dim)}
[hidden]{display:none!important}
</style>

<canvas id="scene" tabindex="0" aria-label="Sailing testbench"></canvas>
<aside class="panel" id="panel" aria-label="Sailing settings">
  <h1>Sailing</h1>
  <div class="row"><label for="ws">Wind speed</label><input id="ws" type="range" min="2" max="9" step="0.1" value="5"><output id="wsV">5.0 m/s</output></div>
  <div class="row"><label for="wd">Wind from</label><input id="wd" type="range" min="0" max="355" step="5" value="250"><output id="wdV">250°</output></div>
  <div class="row"><label for="wg">Gusts</label><input id="wg" type="range" min="0" max="100" step="5" value="45"><output id="wgV">45 %</output></div>
  <div class="row two"><label>Handling</label><div class="seg"><button id="assisted" aria-pressed="true">Assisted</button><button id="realistic" aria-pressed="false">Realistic</button></div></div>
  <div class="actions">
    <button id="pause" aria-pressed="false">Pause</button>
    <button id="reset">Reset to mooring</button>
    <button id="view" aria-pressed="false">Chase view</button>
    <button id="mute" aria-pressed="false">Mute</button>
  </div>
  <h2>Boat</h2>
  <div class="dbg">
    <span>State</span><span id="dState">Moored</span>
    <span>True wind angle</span><span id="dTwa">–</span>
    <span>Apparent wind</span><span id="dAw">–</span>
    <span>Speed</span><span id="dSpd">–</span>
    <span>Target speed</span><span id="dTgt">–</span>
    <span>Heel</span><span id="dHeel">–</span>
    <span>Boom</span><span id="dBoom">–</span>
    <span>Sheet</span><span id="dSheet">–</span>
  </div>
  <canvas id="polar" width="536" height="300" aria-label="Target speed against true wind angle"></canvas>
</aside>
<div class="hud" id="hud" hidden>
  <svg viewBox="-50 -50 100 100" aria-label="Wind relative to the boat">
    <circle r="46" fill="none" stroke="rgba(245,233,215,.35)" stroke-width="1.5"/>
    <path d="M0,-17 C6,-9 7,4 5,15 L-5,15 C-7,4 -6,-9 0,-17Z" fill="#f5e9d7"/>
    <g id="hudArrow"><path d="M0,-44 L0,-22 M-6,-29 L0,-21 L6,-29" fill="none" stroke="#7cc3ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </svg>
  <div class="v"><span>Wind</span><span id="hWind">5.0 m/s</span></div>
  <div class="v"><span>Speed</span><span id="hSpd">0.0 kn</span></div>
  <div class="v" id="hSheetRow" hidden><span>Sheet</span><span id="hSheet">50 %</span></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
const hex=h=>new THREE.Color(h);

/* ================= wind =================
   One wind over the whole sea, for Coast. Everything below this line and above the matching closing line is
   self-contained and may be pasted into index.html as it stands; it needs only THREE.

   const W=createWind(opts)
     opts: speed (m/s, 5), dir (radians, the heading the wind comes FROM, in Coast's convention where a heading h
           points along (sin h, cos h); north is -z, so a wind from the north has dir = PI), gust (0..1, 0.4),
           shift (0..1, 1: the direction wanders by up to 20 degrees), scale (m, 36, the size of a gust),
           seed, shelter(x,z) -> 0..1 (1 where fully sheltered, as in a harbour or a cove; the wind there is cut by
           70 per cent), hour() -> 0..24 and onshore(x,z) -> the heading the sea lies in, seen from the shore (both
           needed for the sea breeze by day and the land breeze at night)
   W.update(dt)       advances time; call it once per frame unless paused
   W.at(x,z[,t[,out]]) {x,z: the air's velocity (where it blows towards), speed, dir (from, as opts.dir), gust (0..1)};
                      out, when given, is filled and returned instead of a new object
   W.set(o)           changes options      W.uniforms   {uGustTex, uGust, uGustAmt} for the sea shader (see the sea)
   W.gustField(x,z)   the raw value of the gust field (0..1)

   The gusts are a field of value noise carried downwind at 0.85 times the wind speed. The same texture is
   sampled by the sea shader, so that the darker ripple patches on the water are where the gusts are. Because
   the field depends only on position and time, a sudden jump in position (Coast's wrap of the world) is
   harmless. */
function createWind(opts={}){
  const O=Object.assign({speed:5,dir:Math.PI/2,gust:0.4,shift:1,scale:36,seed:11,shelter:null,exposure:null,hour:null,onshore:null},opts);
  const N=64, TAU=Math.PI*2, cl=(v,a,b)=>Math.max(a,Math.min(b,v)), sm=(a,b,x)=>{ const t=cl((x-a)/(b-a),0,1); return t*t*(3-2*t); };
  let sd=(O.seed>>>0)||1;
  const R=()=>{ sd=(sd+0x6D2B79F5)>>>0; let t=sd; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
  let a=new Float32Array(N*N).map(()=>R());
  for (let pass=0;pass<2;pass++){ const b=new Float32Array(N*N);
    for (let j=0;j<N;j++) for (let i=0;i<N;i++){ let s=0; for (let dj=-1;dj<=1;dj++) for (let di=-1;di<=1;di++) s+=a[((j+dj+N)%N)*N+(i+di+N)%N]; b[j*N+i]=s/9; }
    a=b; }
  let mn=1, mx=0; for (const v of a){ mn=Math.min(mn,v); mx=Math.max(mx,v); }
  const bytes=new Uint8Array(N*N*4), val=new Float32Array(N*N);
  for (let k=0;k<N*N;k++){ const q=Math.round((a[k]-mn)/(mx-mn)*255); val[k]=q/255; bytes[k*4]=bytes[k*4+1]=bytes[k*4+2]=q; bytes[k*4+3]=255; }
  const tex=new THREE.DataTexture(bytes,N,N,THREE.RGBAFormat);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.magFilter=tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false; tex.needsUpdate=true;
  // bilinear, with the lattice on whole texels, as the GPU samples the texture at (p+0.5)/N
  const samp=(px,pz)=>{ const fx=Math.floor(px), fz=Math.floor(pz), tx=px-fx, tz=pz-fz;
    const i0=((fx%N)+N)%N, j0=((fz%N)+N)%N, i1=(i0+1)%N, j1=(j0+1)%N;
    return (val[j0*N+i0]*(1-tx)+val[j0*N+i1]*tx)*(1-tz)+(val[j1*N+i0]*(1-tx)+val[j1*N+i1]*tx)*tz; };
  let time=0, off=0;
  const PERIOD=()=>O.scale*N;   // the field repeats along the wind every scale*N metres, so the offset is kept below it
  const U={uGustTex:{value:tex},uGust:{value:new THREE.Vector4(0,1,0,O.scale)},uGustAmt:{value:O.gust}};
  const dirAt=t=>O.dir+O.shift*0.349*(0.6*Math.sin(TAU*t/173+0.3)+0.4*Math.sin(TAU*t/67+2.1));
  function gustField(x,z,o=off){ const dx=-Math.sin(O.dir), dz=-Math.cos(O.dir), S=O.scale;
    const al=x*dx+z*dz-o, ac=-x*dz+z*dx;
    return 0.62*samp(al/S,ac/(S*0.75))+0.38*samp(al/(S*0.5)+17.3,ac/(S*0.42)+5.1); }
  function at(x,z,t,out){
    const tt=t===undefined||t===null?time:t, o=off+O.speed*0.85*(tt-time);
    const G=gustField(x,z,o), g=sm(0.56,0.75,G), l=sm(0.44,0.26,G);
    const sp=O.speed*(1+O.gust*(0.6*g-0.28*l)), dir=dirAt(tt)+O.gust*0.1*(g-0.5);
    let vx=-Math.sin(dir)*sp, vz=-Math.cos(dir)*sp;
    if (O.hour && O.onshore){ const hr=O.hour(), on=O.onshore(x,z);
      const sea=2.4*sm(10,13,hr)*sm(19,16.5,hr), land=1.4*(hr>12?sm(21,23,hr):sm(7,5,hr));
      vx+=-Math.sin(on)*sea+Math.sin(on)*land; vz+=-Math.cos(on)*sea+Math.cos(on)*land; }
    if (O.shelter){ const k=1-0.7*cl(O.shelter(x,z)||0,0,1); vx*=k; vz*=k; }
    if (O.exposure){ const k=O.exposure(x,z)||1; vx*=k; vz*=k; }   // stronger out on the open sea
    const s=Math.hypot(vx,vz), d=s>1e-6?Math.atan2(-vx,-vz):dir;
    if (out){ out.x=vx; out.z=vz; out.speed=s; out.dir=d; out.gust=g; return out; }
    return {x:vx,z:vz,speed:s,dir:d,gust:g};
  }
  function writeU(){ U.uGust.value.set(-Math.sin(O.dir),-Math.cos(O.dir),off,O.scale); U.uGustAmt.value=O.gust; }
  function update(dt){ if (dt>0){ time+=dt; off=(off+O.speed*0.85*dt)%PERIOD(); } writeU(); }
  function set(o){ Object.assign(O,o); writeU(); }
  writeU();
  return {at,update,set,gustField,uniforms:U,options:O,get time(){ return time; }};
}
/* ================= end of wind ================= */

/* ================= dinghy =================
   A sailing dinghy for Coast: 4 m long and 1.5 m in the beam, clinker-built, with one mainsail on a short mast.
   Everything below this line and above the matching closing line is self-contained and may be pasted into
   index.html as it stands; it needs only THREE.

   const D=createDinghy(parent, opts)    parent: the group the meshes join (in Coast, `world`)
     opts: x, z, head (heading: the bow points along (sin head, cos head)), number ('17'), mode ('assisted' or
           'realistic'), colours (hull, band, bottom, inner, varnish, wood, sail, mark, pennant),
           mooring {x,z,head, stern:{x,y,z}, bow:{x,y,z}} (the lines run to these points; the boat is held
           there until boarded), onSound(kind, strength): kind 'gybe', 'ground' or 'tack'
   D.update(dt, ctx)
     ctx: wind (from createWind), depthAt(x,z) (depth of water, positive at sea; in Coast -heightAt),
          surfaceAt(x,z) (height of the sea surface at this moment), obstacles {obbs:[{x,z,hw,hd,rot}],
          circles:[{x,z,r}]} as Coast's blocks hold them, boats [{x,z,head,len,beam}],
          input {steer: -1 port .. +1 starboard, trim: +1 sheets in .. -1 eases, paddle: -1 .. +1},
          walkAt(x,z) (the height a walker would stand at, or null; used by leave), paused
   D.board()            puts the player aboard and casts off      D.leave(ctx) -> {x,y,z,head} or null
   D.landing(ctx)       the place leave() would use, or null       D.canBoard(x,z) (within 6 m)
   D.eye(camera, yaw, pitch)   puts a camera (sharing the parent) at the helm, looking yaw/pitch relative to the bow
   D.setMode(m)   D.moor(m)   D.shift(dx,dz) (moves the boat and its history, for a wrap of the world)
   D.polar(degrees) -> target speed as a fraction of the true wind speed      D.state   D.mesh   D.info
   D.dispose()

   Local axes of the boat: +z towards the bow, +x to port, y up, the waterline at y = 0. */
function createDinghy(parent, opts={}){
  const O=Object.assign({number:'17',hull:'#f2ede4',band:'#2f5f8f',bottom:'#b5473a',inner:'#ebe1cf',varnish:'#c0884a',wood:'#9b7652',
    sail:'#f3ebd9',mark:'#2f5f8f',pennant:'#c4544b',rope:'#d8cdb4',mode:'assisted',x:0,z:0,head:0,mooring:null,onSound:null},opts);
  const TAU=Math.PI*2, D2R=Math.PI/180;
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v)), sm=(a,b,x)=>{ const t=cl((x-a)/(b-a),0,1); return t*t*(3-2*t); };
  const lp=(a,b,t)=>a+(b-a)*t, wrap=a=>Math.atan2(Math.sin(a),Math.cos(a)), sg=v=>v<0?-1:1, col=c=>new THREE.Color(c);
  const sound=(k,s)=>{ if (O.onSound) try { O.onSound(k,s); } catch(e){} };

  /* ---------- the lines of the hull ----------
     t runs from the transom (0) to the stem (1); s round each section from the keel (0) to the sheer (1). */
  const LEN=4.0, ZS=-2.0, ZM=1.04;
  const bAt=t=>t<0.45?0.56+0.19*Math.sin(t/0.45*Math.PI/2):0.75*Math.cos(Math.pow((t-0.45)/0.55,1.25)*Math.PI/2);
  const shAt=t=>0.39+(t<0.4?0.04*Math.pow((0.4-t)/0.4,2):0)+(t>0.45?0.19*Math.pow((t-0.45)/0.55,2):0);
  const kAt=t=>-0.22+(t<0.3?0.10*Math.pow(1-t/0.3,2):0)+(t>0.7?0.52*Math.pow((t-0.7)/0.3,2):0);
  const zAt=t=>ZS+t*LEN;
  const sec=(t,s)=>{ const b=bAt(t), k=kAt(t), h=shAt(t); return [b*Math.pow(Math.sin(s*Math.PI/2),0.75),k+(h-k)*Math.pow(s,1.5),zAt(t)]; };
  const secN=(t,s)=>{ const a=sec(t,Math.max(0,s-0.01)), b=sec(t,Math.min(1,s+0.01)), dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; return [dy/l,-dx/l]; };
  const sAtY=(t,y)=>{ const k=kAt(t), h=shAt(t); return y<=k?0:Math.pow(cl((y-k)/(h-k),0,1),2/3); };
  const halfBeam=lz=>bAt(cl((lz-ZS)/LEN,0,1))*0.98;

  /* ---------- a small geometry builder: flat-shaded triangles with colours, faced away from a hint point ---------- */
  const BOX=new THREE.BoxGeometry(1,1,1);
  class GB{ constructor(){ this.p=[]; this.c=[]; }
    tri(a,b,c,hint,k){ const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
      const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx; if (nx*nx+ny*ny+nz*nz<1e-14) return;
      const cx=(a[0]+b[0]+c[0])/3-hint[0], cy=(a[1]+b[1]+c[1])/3-hint[1], cz=(a[2]+b[2]+c[2])/3-hint[2];
      if (nx*cx+ny*cy+nz*cz<0){ const t=b; b=c; c=t; }
      this.p.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2]); for (let i=0;i<3;i++) this.c.push(k.r,k.g,k.b); }
    quad(a,b,c,d,hint,k){ this.tri(a,b,c,hint,k); this.tri(a,c,d,hint,k); }
    geo(g,m,k){ const gg=g.index?g.toNonIndexed():g.clone(); gg.applyMatrix4(m); const p=gg.attributes.position.array;
      for (let i=0;i<p.length;i++) this.p.push(p[i]); for (let i=0;i<p.length/3;i++) this.c.push(k.r,k.g,k.b); gg.dispose(); }
    box(x,y,z,w,h,d,k,ry=0,rx=0,rz=0){ this.geo(BOX,new THREE.Matrix4().compose(new THREE.Vector3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz,'YXZ')),new THREE.Vector3(w,h,d)),k); }
    seg(p,q,w,h,k){ const dx=q[0]-p[0], dy=q[1]-p[1], dz=q[2]-p[2], len=Math.hypot(dx,dy,dz);
      this.box((p[0]+q[0])/2,(p[1]+q[1])/2,(p[2]+q[2])/2,w,h,len+0.01,k,Math.atan2(dx,dz),-Math.atan2(dy,Math.hypot(dx,dz))); }
    cyl(p,q,r0,r1,k,n=8){ const d=new THREE.Vector3(q[0]-p[0],q[1]-p[1],q[2]-p[2]), len=d.length(); const g=new THREE.CylinderGeometry(r1,r0,len,n);
      this.geo(g,new THREE.Matrix4().compose(new THREE.Vector3((p[0]+q[0])/2,(p[1]+q[1])/2,(p[2]+q[2])/2),new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize()),new THREE.Vector3(1,1,1)),k); g.dispose(); }
    build(){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(this.p,3)); g.setAttribute('color',new THREE.Float32BufferAttribute(this.c,3)); g.computeVertexNormals(); return g; }
  }
  const K={hull:col(O.hull),band:col(O.band),bot:col(O.bottom),inner:col(O.inner),varn:col(O.varnish),wood:col(O.wood),dark:col('#2b2b35'),metal:col('#8d8f93')};
  const darker=(c,f)=>c.clone().multiplyScalar(f);

  function buildHull(){
    const g=new GB(), NT=26, SB=[0,0.2,0.36,0.52,0.68,0.84,1], SC=[K.bot,K.bot,K.hull,K.hull,K.hull,K.band], LAP=0.016;
    const ts=[]; for (let i=0;i<=NT;i++){ const u=i/NT; ts.push(u<0.8?u:0.8+(u-0.8)*(1-0.15*(u-0.8)/0.2)); } ts[NT]=1;
    for (const sx of [1,-1]){
      const P=(t,s,lap=0)=>{ const p=sec(t,s); if (lap){ const n=secN(t,s); p[0]+=n[0]*lap; p[1]+=n[1]*lap; } p[0]*=sx; return p; };
      for (let i=0;i<NT;i++){ const t0=ts[i], t1=ts[i+1], tm=(t0+t1)/2, hint=[0,(kAt(tm)+shAt(tm))/2,zAt(tm)-0.6*sm(0.6,1,tm)];
        // the strakes, each lapping over the one below it
        // each face is turned outwards along the section's own normal, which stays right where the hull narrows to the stem
        const inward=(sMid)=>{ const n=secN(tm,sMid), c=sec(tm,sMid); return [sx*(c[0]-n[0]),c[1]-n[1],c[2]]; };
        for (let j=0;j<6;j++){ const lap=j>0?LAP:0, sMid=(SB[j]+SB[j+1])/2;
          g.quad(P(t0,SB[j],lap),P(t1,SB[j],lap),P(t1,SB[j+1]),P(t0,SB[j+1]),inward(sMid),SC[j]);
          if (j>0) g.quad(P(t0,SB[j]),P(t1,SB[j]),P(t1,SB[j],LAP),P(t0,SB[j],LAP),inward(SB[j]),darker(SC[j],0.72)); }
        // the inside, painted, above the floorboards
        if (t1<0.985){ const far=[sx*6,0.25,hint[2]], IN=(t,s)=>{ const p=sec(t,s); return [sx*Math.max(0,p[0]*0.965-0.014),p[1],p[2]]; };

  const L=D.leave(ctx); if (!L) return false;
  walker.x=L.x; walker.z=L.z; walker.y=L.y; walker.yaw=L.head+Math.PI; walker.pitch=-0.12; mode='walk'; showHud(); return true; }
function resetBoat(){ if (mode==='sail'){ mode='walk'; } D.moor(JSON.parse(JSON.stringify(MOOR))); walker.x=-36.5; walker.z=-22.4; walker.y=1.6; walker.yaw=Math.PI*0.92; walker.pitch=-0.18; showHud(); }

/* ---------- sound: the bow wave from the game's loop, the sail and the gybe synthesised ---------- */
function startAudio(){
  if (audio.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if (!AC) return;
  const ac=new AC(); audio.ctx=ac; audio.master=ac.createGain(); audio.master.gain.value=audio.muted?0:1; audio.master.connect(ac.destination);
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate), d=nb.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; audio.noise=nb;
  { const s=ac.createBufferSource(); s.buffer=nb; s.loop=true; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.8; const g=ac.createGain(); g.gain.value=0;
    s.connect(bp).connect(g).connect(audio.master); s.start(); audio.flap={g,bp}; }
  fetch(encodeURI('../village sounds/bow wave loop.mp3')).then(r=>r.arrayBuffer()).then(b=>ac.decodeAudioData(b)).then(buf=>{
    const s=ac.createBufferSource(); s.buffer=buf; s.loop=true; const g=ac.createGain(); g.gain.value=0; s.connect(g).connect(audio.master); s.start(); audio.bow={s,g}; }).catch(()=>{});
}
function sfx(kind,str){ const ac=audio.ctx; if (!ac || audio.muted) return; const t=ac.currentTime;
  if (kind==='gybe'||kind==='ground'){ const s=ac.createBufferSource(); s.buffer=audio.noise; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=kind==='gybe'?1400:380;
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5*str+0.05,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+(kind==='gybe'?0.22:0.45));
    s.connect(lp).connect(g).connect(audio.master); s.start(t); s.stop(t+0.6);
    const o=ac.createOscillator(); o.frequency.setValueAtTime(kind==='gybe'?110:60,t); o.frequency.exponentialRampToValueAtTime(40,t+0.25); const og=ac.createGain();
    og.gain.setValueAtTime(0.0001,t); og.gain.exponentialRampToValueAtTime(0.45*str+0.05,t+0.01); og.gain.exponentialRampToValueAtTime(0.0001,t+0.3); o.connect(og).connect(audio.master); o.start(t); o.stop(t+0.35); } }
function updateAudio(){ const ac=audio.ctx; if (!ac) return; const t=ac.currentTime, S=D.state, on=mode==='sail'&&!paused;
  const spd=on?Math.abs(S.u):0;
  if (audio.bow){ audio.bow.g.gain.setTargetAtTime(0.75*sm(0.15,3.2,spd),t,0.15); audio.bow.s.playbackRate.setTargetAtTime(clamp(0.7+0.13*spd,0.6,1.5),t,0.2); }
  if (audio.flap){ const lv=on?S.flap:0, w=0.5+0.5*Math.abs(Math.sin(time*Math.PI*(4+S.aws*0.6))); audio.flap.g.gain.setTargetAtTime(0.16*lv*w,t,0.02); audio.flap.bp.frequency.setTargetAtTime(700+S.aws*60,t,0.1); } }
function setMute(m){ audio.muted=m; if (audio.master) audio.master.gain.value=m?0:1; $('mute').setAttribute('aria-pressed',m); }

/* ---------- input ---------- */
const $=id=>document.getElementById(id);
const keys={};
let paused=false;
addEventListener('keydown',e=>{ startAudio(); keys[e.code]=true; if (e.repeat) return;
  if (e.code==='KeyY') toggleBoat();
  else if (e.code==='KeyP') setPause(!paused);
  else if (e.code==='KeyV') setCam(camMode==='chase'?'fp':'chase');
  else if (e.code==='KeyM') setMute(!audio.muted);
  else if (e.code==='KeyR') resetBoat();
  if (['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
addEventListener('blur',()=>{ for (const k in keys) keys[k]=false; });
function lookBy(dx,dy){ if (camMode==='chase'){ chase.yaw-=dx*0.004; chase.pitch=clamp(chase.pitch+dy*0.003,0.02,1.3); return; }
  if (mode==='sail'){ look.yaw-=dx*0.0026; look.pitch=clamp(look.pitch-dy*0.0026,-1.1,1.1); }
  else { walker.yaw-=dx*0.0026; walker.pitch=clamp(walker.pitch-dy*0.0026,-1.2,1.2); } }
let dragging=false, lmx=0, lmy=0;
canvas.addEventListener('mousedown',e=>{ startAudio(); dragging=true; lmx=e.clientX; lmy=e.clientY; try{ const p=canvas.requestPointerLock(); if (p&&p.catch) p.catch(()=>{}); }catch(_){} });
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{ if (document.pointerLockElement===canvas) lookBy(e.movementX,e.movementY); else if (dragging){ lookBy(e.clientX-lmx,e.clientY-lmy); lmx=e.clientX; lmy=e.clientY; } });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); if (camMode==='chase') chase.dist=clamp(chase.dist*Math.exp(e.deltaY*0.001),4,40); },{passive:false});
// a game controller: the left stick steers (and walks), the triggers trim, the right stick looks, Y boards and steps ashore
const pad={x:0,y:0,lt:0,rt:0,held:new Set()};
function pollPad(dt){ const gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(g=>g&&g.connected);
  if (!gp){ pad.x=pad.y=pad.lt=pad.rt=0; return; }
  const DZ=0.26, dz=v=>Math.abs(v)<DZ?0:Math.sign(v)*(Math.abs(v)-DZ)/(1-DZ);
  pad.x=dz(gp.axes[0]||0); pad.y=dz(gp.axes[1]||0);
  const rx=dz(gp.axes[2]||0), ry=dz(gp.axes[3]||0); if (rx||ry) lookBy(rx*Math.abs(rx)*dt*1100,ry*Math.abs(ry)*dt*800);
  pad.lt=gp.buttons[6]?gp.buttons[6].value:0; pad.rt=gp.buttons[7]?gp.buttons[7].value:0;
  for (const [i,fn] of [[3,toggleBoat],[1,()=>setCam(camMode==='chase'?'fp':'chase')],[9,()=>setPause(!paused)],[8,()=>setMute(!audio.muted)]]){
    const b=gp.buttons[i], on=!!b&&(b.pressed||b.value>0.5); if (on&&!pad.held.has(i)){ pad.held.add(i); fn(); } else if (!on) pad.held.delete(i); } }

/* ---------- the panel ---------- */
const bindRange=(id,fmt,set)=>{ const el=$(id), out=$(id+'V'); const f=()=>{ out.textContent=fmt(+el.value); set(+el.value); }; el.addEventListener('input',f); f(); };
bindRange('ws',v=>v.toFixed(1)+' m/s',v=>wind.set({speed:v}));
bindRange('wd',v=>v+'°',v=>wind.set({dir:bearingToHead(v)}));
bindRange('wg',v=>v+' %',v=>wind.set({gust:v/100}));
function setHandling(m){ D.setMode(m); $('assisted').setAttribute('aria-pressed',m==='assisted'); $('realistic').setAttribute('aria-pressed',m==='realistic'); $('hSheetRow').hidden=m!=='realistic'; }
$('assisted').onclick=()=>setHandling('assisted'); $('realistic').onclick=()=>setHandling('realistic');
function setPause(p){ paused=p; $('pause').textContent=p?'Resume':'Pause'; $('pause').setAttribute('aria-pressed',p); }
$('pause').onclick=()=>setPause(!paused);
$('reset').onclick=()=>resetBoat();
function setCam(m){ camMode=m; $('view').textContent=m==='chase'?'First person':'Chase view'; $('view').setAttribute('aria-pressed',m==='chase'); }
$('view').onclick=()=>setCam(camMode==='chase'?'fp':'chase');
$('mute').onclick=()=>setMute(!audio.muted);
function showHud(){ $('hud').hidden=mode!=='sail'; }

const pc=$('polar'), pg=pc.getContext('2d');
function drawPolar(){ const W=pc.width, H=pc.height, cx=W/2, cy=H/2, R=H/2-26, S=D.state, k=R/0.6;
  const P=(deg,f,side)=>{ const r=deg*Math.PI/180; return [cx+side*Math.sin(r)*f*k, cy-Math.cos(r)*f*k]; };
  pg.clearRect(0,0,W,H); pg.lineWidth=2; pg.font='500 20px "Alegreya Sans", sans-serif'; pg.textAlign='center'; pg.textBaseline='middle';
  pg.strokeStyle='rgba(245,233,215,.18)';
  for (const f of [0.2,0.4,0.6]){ pg.beginPath(); pg.arc(cx,cy,f*k,0,Math.PI*2); pg.stroke(); }
  for (const a of [0,45,90,135]){ const [x0,y0]=P(a,0.6,-1), [x1,y1]=P(a+180,0.6,-1); pg.beginPath(); pg.moveTo(x0,y0); pg.lineTo(x1,y1); pg.stroke(); }
  pg.fillStyle='rgba(216,93,82,.25)'; pg.beginPath(); pg.moveTo(cx,cy); for (let a=-40;a<=40;a+=2){ const [x,y]=P(Math.abs(a),0.6,a<0?-1:1); pg.lineTo(x,y); } pg.closePath(); pg.fill();
  pg.strokeStyle='#7cc3ad'; pg.lineWidth=3;
  for (const side of [-1,1]){ pg.beginPath(); for (let a=0;a<=180;a+=2){ const [x,y]=P(a,D.polar(a),side); a?pg.lineTo(x,y):pg.moveTo(x,y); } pg.stroke(); }
  pg.fillStyle='rgba(245,233,215,.75)'; pg.fillText('0°',cx,12); pg.fillText('180°',cx,H-12); pg.textAlign='left'; pg.fillText('90°',cx+k*0.6+8,cy); pg.textAlign='right'; pg.fillText('90°',cx-k*0.6-8,cy);
  pg.textAlign='left'; pg.fillText('0.6',cx+6,cy-k*0.6+12);
  if (mode==='sail' && S.tws>0.1){ const side=S.twa>=0?-1:1, a=Math.abs(S.twa)*180/Math.PI;
    const [tx,ty]=P(a,Math.max(0,S.target)/S.tws,side); pg.strokeStyle='#f5e9d7'; pg.lineWidth=2; pg.beginPath(); pg.arc(tx,ty,8,0,Math.PI*2); pg.stroke();
    const [bx,by]=P(a,clamp(Math.max(0,S.u)/S.tws,0,0.75),side); pg.fillStyle='#d85d52'; pg.beginPath(); pg.arc(bx,by,6,0,Math.PI*2); pg.fill(); } }

const KN=1.943844;
let readT=0;
function readouts(dt){ readT-=dt; if (readT>0) return; readT=0.1; const S=D.state, deg=v=>Math.round(v*180/Math.PI);
  const st=mode!=='sail'?(S.moored?'Moored':'Ashore'):S.rescue?'Easing off':S.inIrons?'In irons':S.aground?'Aground':S.contact?'Touching':S.gybing?'Gybing':S.luff>0.6?'Luffing':S.stall>0.4?'Stalled':'Sailing';
  $('dState').textContent=st;
  $('dTwa').textContent=`${Math.abs(deg(S.twa))}° ${S.twa>=0?'port':'starboard'}`;
  $('dAw').textContent=`${S.aws.toFixed(1)} m/s at ${Math.abs(deg(S.awa))}°`;
  $('dSpd').textContent=`${(S.u*KN).toFixed(1)} kn  ${S.u.toFixed(2)} m/s`;
  $('dTgt').textContent=`${(S.target*KN).toFixed(1)} kn  ${S.target.toFixed(2)} m/s`;
  $('dHeel').textContent=`${Math.abs(deg(S.heel))}°`;
  $('dBoom').textContent=`${Math.abs(deg(S.boom))}°`;
  $('dSheet').textContent=S.mode==='realistic'?`${Math.round(S.sheet*100)} % out`:'Self-trimming';
  if (mode==='sail'){ $('hWind').textContent=S.tws.toFixed(1)+' m/s'; $('hSpd').textContent=(Math.max(0,S.u)*KN).toFixed(1)+' kn'; $('hSheet').textContent=Math.round(S.sheet*100)+' %';
    $('hudArrow').setAttribute('transform',`rotate(${-deg(S.twa)})`); }
  drawPolar(); }

function resize(){ const w=innerWidth, h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

/* ---------- the frame ---------- */
const _t=new THREE.Vector3();
function tick(dt){
  pollPad(dt);
  const wdt=paused?0:dt; time+=wdt; seaU.uTime.value=time; wind.update(wdt); seaU.uRough.value=0.55+wind.options.speed/8;
  if (tb.input){ Object.assign(input,tb.input); }
  else if (mode==='sail'){ input.steer=clamp((keys.KeyD?1:0)-(keys.KeyA?1:0)+pad.x,-1,1); const ws=(keys.KeyW?1:0)-(keys.KeyS?1:0)-pad.y;
    input.paddle=clamp(ws,-1,1); input.trim=clamp((D.state.mode==='realistic'?(keys.KeyW?1:0)-(keys.KeyS?1:0):0)+pad.rt-pad.lt,-1,1); }
  else { input.steer=input.trim=input.paddle=0; }
  if (mode==='walk') walkStep(dt);
  ctx.paused=ctxOther.paused=paused;
  D.update(dt,ctx); for (const o of others) o.update(dt,ctxOther);
  for (let i=0;i<buoyMeshes.length;i++){ const b=buoyMeshes[i]; b.position.y=seaSurface(b.position.x,b.position.z)+(i<BUOYS.length?0:0.05); b.rotation.z=0.08*Math.sin(time*1.3+i); b.rotation.x=0.06*Math.sin(time*0.9+i*2); }
  // cameras: the first person at the helm or at street level, or a chase view round the boat (or the walker)
  if (camMode==='fp'){
    if (mode==='sail') D.eye(camera,look.yaw,look.pitch);
    else { camera.position.set(walker.x,walker.y+1.62,walker.z); camera.rotation.set(walker.pitch,walker.yaw,0,'YXZ'); } }
  else if (camMode==='chase'){ const S=D.state, fx=mode==='sail'?S.x:walker.x, fz=mode==='sail'?S.z:walker.z, fy=mode==='sail'?1.2:walker.y+1, base=mode==='sail'?S.head:walker.yaw+Math.PI;
    const a=base+Math.PI+chase.yaw, cp=Math.cos(chase.pitch), d=chase.dist;
    camera.position.set(fx+Math.sin(a)*cp*d,fy+Math.sin(chase.pitch)*d,fz+Math.cos(a)*cp*d); camera.lookAt(fx,fy,fz); }
  _t.set(camera.position.x,0,camera.position.z); const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion); _t.x+=fwd.x*15; _t.z+=fwd.z*15;
  sun.target.position.set(Math.round(_t.x/2)*2,0,Math.round(_t.z/2)*2); sun.position.copy(sun.target.position).addScaledVector(LIGHT_DIR,200);
  sky.position.copy(camera.position);
  updateAudio(); readouts(dt);
}
let last=performance.now();
const tb={manual:false,input:null,D,others,wind,walker,camera,soundLog,audio,startAudio,obstacles,depthAt,groundH,walkAt,seaSurface,look,chase,
  get mode(){ return mode; }, get time(){ return time; },
  advance(sec,fps=60){ const n=Math.round(sec*fps); for (let i=0;i<n;i++) tick(1/fps); renderer.render(scene,camera); },
  step(sec,fps=60,each){ const n=Math.round(sec*fps); for (let i=0;i<n;i++){ tick(1/fps); if (each) each(i/fps); } },
  view(px,py,pz,tx,ty,tz){ camMode='free'; camera.position.set(px,py,pz); camera.lookAt(tx,ty,tz); sky.position.copy(camera.position);
    sun.target.position.set(tx,0,tz); sun.position.copy(sun.target.position).addScaledVector(LIGHT_DIR,200); renderer.render(scene,camera); },
  boardNow(){ D.board(); mode='sail'; look.yaw=0; look.pitch=-0.1; showHud(); }, toggleBoat, resetBoat, setHandling, setPause, setCam, render(){ renderer.render(scene,camera); }, readouts:()=>{ readT=0; readouts(0); }};
window.tb=tb;
showHud();
function frame(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; if (!tb.manual){ tick(dt); renderer.render(scene,camera); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
