<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coast · picture effects</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#e9e4da;font-family:'Alegreya Sans',system-ui,sans-serif;color:#2b2b35;}
  main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;padding-right:300px;box-sizing:border-box;}
  figure{margin:0;}
  figure img,figure canvas{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,0.15);background:#fff;}
  figcaption{font-size:14px;color:#555;margin-top:4px;}
  #panel{position:fixed;top:12px;right:12px;width:260px;padding:12px 14px;border-radius:10px;
    background:rgba(250,246,238,0.94);font-size:15px;box-shadow:0 2px 14px rgba(0,0,0,0.15);}
  #panel .row{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:6px;margin:6px 0;}
  #panel label{color:#555}
  #panel button,#panel select{font:inherit;font-size:14px;padding:4px 6px;border:1px solid #c9bda9;border-radius:6px;background:#fffaf2;color:#2b2b35;cursor:pointer;}
  #panel .stats{margin-top:8px;font-size:13px;color:#555;font-variant-numeric:tabular-nums;}
  @media (max-width:760px){ main{grid-template-columns:1fr;padding-right:12px;padding-bottom:200px;} #panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;} }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<main>
  <figure><img id="src" alt="Source picture"><figcaption>Source</figcaption></figure>
  <figure><canvas id="out"></canvas><figcaption id="outCap">Effect</figcaption></figure>
</main>
<div id="panel">
  <div class="row"><label for="pic">Picture</label><select id="pic">
    <option value="street">Street</option><option value="harbour">Harbour</option><option value="hillside">Hillside</option>
    <option value="sunset">Sunset</option><option value="closeup">Café</option></select></div>
  <div class="row"><label for="fx">Effect</label><select id="fx">
    <option value="watercolour">Watercolour</option><option value="oil">Oil painting</option><option value="impressionist">Impressionist</option></select></div>
  <div class="row"><label for="seed">Seed</label><select id="seed"><option>1</option><option>2</option><option>3</option></select></div>
  <div class="row"><span></span><button id="save">Save picture</button></div>
  <div class="stats" id="stats"></div>
</div>
<script type="module">
import { applyEffect } from '../photo/effects.js';
const $=id=>document.getElementById(id);
const load=name=>new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=`photo-src/${name}.jpg`; });
async function run(fx,pic,opts={}){
  const im=await load(pic); $('src').src=im.src;
  const t0=performance.now();
  const c=await applyEffect(fx,im,opts);
  const ms=performance.now()-t0;
  const out=$('out'); out.width=c.width; out.height=c.height; out.getContext('2d').drawImage(c,0,0);
  $('outCap').textContent=$('fx').selectedOptions[0].text;
  $('stats').textContent=`${c.width} × ${c.height} · ${Math.round(ms)} ms`;
  return c;
}
const go=()=>run($('fx').value,$('pic').value,{seed:+$('seed').value});
['pic','fx','seed'].forEach(id=>$(id).addEventListener('change',go));
$('save').addEventListener('click',()=>{ const a=document.createElement('a'); a.download=`${$('pic').value}-${$('fx').value}.png`; a.href=$('out').toDataURL('image/png'); a.click(); });
// for automated renders: returns the result as a PNG data URL
window.__run=async(fx,pic,opts)=>{ $('fx').value=fx; $('pic').value=pic; const c=await run(fx,pic,opts); return c.toDataURL('image/png'); };
go();
</script>
</body>
</html>
